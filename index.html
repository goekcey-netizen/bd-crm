<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AgenturManager CRM</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel für JSX Kompilierung im Browser -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1",

            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F2F2F7; 
            -webkit-tap-highlight-color: transparent;
            /* Support for iPhone Notch/Home Bar */
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .pattern-diagonal-stripes {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, #f3f4f6 5px, #f3f4f6 10px);
        }

        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scale-in 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        /* iOS Input Zoom Fix */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Safe Area Utilities */
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .top-safe { top: env(safe-area-inset-top); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Users, LayoutDashboard, Lock, Shield, 
            Search, Calendar, LogOut, Upload, Plus, 
            X, User, Save, CheckCircle, AlertCircle,
            Briefcase, FileSpreadsheet, Link as LinkIcon, RefreshCw, AlertTriangle, Copy,
            ChevronRight, Phone, Mail, MapPin, Trash2, RotateCcw, Eye, EyeOff, Edit3, ExternalLink, Filter, Activity,
            FileText, Download, Share2, Circle, ChevronDown, ArrowLeft, Loader2, ChevronLeft, Info,
            ClipboardList, Menu, Clock, CalendarX, Printer, UserPlus, Layers
        } from 'lucide-react';

        import { initializeApp } from 'firebase/app';
        import { 
            getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, 
            onSnapshot, query, setDoc, getDoc, where, getDocs, writeBatch, 
            orderBy, limit, serverTimestamp
        } from 'firebase/firestore';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from 'firebase/auth';

        // --- KONFIGURATION & INIT ---
        const APP_VERSION = "v1.4.2-safe";
        
        // Globale Variablen simulieren
        const __firebase_config = typeof window !== 'undefined' ? window.__firebase_config : null; 
        const __app_id = typeof window !== 'undefined' ? window.__app_id : 'agenturmanager-crm';
        const __initial_auth_token = typeof window !== 'undefined' ? window.__initial_auth_token : null;

        let app, auth, db, initError;

        try {
            const fallbackConfig = {
                apiKey: "AIzaSyAtuk5zW_Q4K65ANwuANPypwmmvSOQfKlA",
                authDomain: "agenturmanager-96ff4.firebaseapp.com",
                projectId: "agenturmanager-96ff4",
                storageBucket: "agenturmanager-96ff4.firebasestorage.app",
                messagingSenderId: "510352845810",
                appId: "1:510352845810:web:5ad373711c092465d3996b"
            };
            
            if (__firebase_config) {
                 app = initializeApp(JSON.parse(__firebase_config));
            } else {
                 app = initializeApp(fallbackConfig);
            }
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Init Fehler:", e);
            initError = e;
        }

        const APP_ID = __app_id;

        // --- HELPERS ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => { const h = setTimeout(() => setDebouncedValue(value), delay); return () => clearTimeout(h); }, [value, delay]);
            return debouncedValue;
        }

        const copyToClipboard = (text, showToastFn) => {
            if (!text) return;
            // Modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToastFn("Kopiert!")).catch(() => showToastFn("Fehler", "error"));
                return;
            }
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) showToastFn("Kopiert!");
                else showToastFn("Fehler beim Kopieren", "error");
            } catch (err) { showToastFn("Kopieren nicht möglich", "error"); }
            document.body.removeChild(textArea);
        };

        const parseAnyDate = (dateStr) => {
            if (!dateStr) return null;
            if (dateStr.includes('-')) { const [y, m, d] = dateStr.split('-'); return new Date(y, m - 1, d); }
            if (dateStr.includes('.')) { const [d, m, y] = dateStr.split('.'); return new Date(y, m - 1, d); }
            return null;
        };

        const formatDateToGerman = (dateInput) => {
            if (!dateInput) return '';
            let date = dateInput;
            if (typeof dateInput === 'string') date = parseAnyDate(dateInput);
            if (!date || isNaN(date.getTime())) return dateInput;
            return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`;
        };

        const formatDateTime = (isoString) => {
            if (!isoString) return '-';
            try { return new Date(isoString).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) { return '-'; }
        };

        const normalizeName = (name) => { if (!name) return ''; return name.replace(/[:.;,]/g, ' ').replace(/\s+/g, ' ').trim(); };

        const getFirstName = (fullName) => { 
            if (!fullName) return ''; 
            if (fullName.includes(',')) { 
                const parts = fullName.split(','); 
                if (parts.length > 1) return parts[1].trim().split(' ')[0]; 
            } 
            return fullName.split(' ')[0]; 
        };
        const normalizeNumber = (val) => { if(!val) return ''; return String(val).replace(/[^0-9]/g, '').replace(/^0+/, ''); };

        const generateUserId = (name) => {
            const map = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' };
            let cleanName = normalizeName(name).toLowerCase().replace(/[äöüß]/g, m => map[m]);
            return cleanName.replace(/[^a-z0-9]/g, '_') || 'user_' + Math.floor(Math.random() * 10000);
        };

        const generateStableId = (vorname, name, gebDatum) => {
            const raw = `${vorname}|${name}|${gebDatum}`.toLowerCase().replace(/[^a-z0-9]/g, '');
            return raw || 'unknown-' + Math.random();
        };

        const checkMatch = (allowedUsersList, customer) => {
            if (!allowedUsersList || !Array.isArray(allowedUsersList)) return false;
            if (allowedUsersList.some(u => u.role === 'admin')) return true;
            return allowedUsersList.some(user => {
                if (!user) return false;
                const userAdv = normalizeNumber(user.adv);
                const custAdp = normalizeNumber(customer.adp); 
                const custBtnr = normalizeNumber(customer.btnr); 
                const userBtnr = normalizeNumber(user.btnr);
                if (userAdv.length > 2 && ((custAdp && userAdv.includes(custAdp)) || (custBtnr && userAdv.includes(custBtnr)))) return true;
                if (userBtnr.length > 2 && ((custAdp && userBtnr.includes(custAdp)) || (custBtnr && userBtnr.includes(custBtnr)))) return true;
                const userName = normalizeName(user.name).toLowerCase();
                const custAdpName = normalizeName(customer.adp).toLowerCase(); 
                if (userName.length > 2 && custAdpName.includes(userName)) return true;
                return false;
            });
        };

        const isBirthdayUpcoming = (dateStr) => {
            const dob = parseAnyDate(dateStr);
            if (!dob) return false;
            const today = new Date();
            const nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
            if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);
            const diffDays = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24)); 
            return diffDays >= 0 && diffDays <= 30;
        };

        const getNextBirthdayDate = (dateStr) => {
            const dob = parseAnyDate(dateStr);
            if (!dob) return new Date(9999, 11, 31);
            const today = new Date();
            const nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
            if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);
            return nextBirthday;
        };

        const isExpiringSoon = (dateStr) => {
            const expiry = parseAnyDate(dateStr);
            if (!expiry) return false;
            const today = new Date();
            const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
            return diffDays > 0 && diffDays <= 90;
        };

        const getColumnValue = (row, searchTerms) => {
            const keys = Object.keys(row);
            for (const term of searchTerms) { if (row[term]) return row[term]; }
            for (const term of searchTerms) { const k = keys.find(k => k.toLowerCase().trim() === term.toLowerCase()); if (k && row[k]) return row[k]; }
            return '';
        };

        const analyzeGaps = (contracts) => {
            if (!contracts) return [];
            const currentTypes = contracts.map(c => (c.sparte || '').toLowerCase());
            const gaps = [];
            if (!currentTypes.some(t => t.includes('haftpflicht') || t.includes('phv'))) gaps.push('Privathaftpflicht');
            if (!currentTypes.some(t => t.includes('hausrat') || t.includes('vhr'))) gaps.push('Hausrat');
            if (!currentTypes.some(t => t.includes('wohngebäude') || t.includes('gebäude'))) gaps.push('Wohngebäude');
            if (!currentTypes.some(t => t.includes('kfz') || t.includes('auto'))) gaps.push('KFZ');
            if (!currentTypes.some(t => t.includes('rechts') || t.includes('rs'))) gaps.push('Rechtsschutz');
            if (!currentTypes.some(t => t.includes('unfall'))) gaps.push('Unfall');
            return gaps;
        };

        const generateWordDoc = (type, customer, user) => {
            const dateStr = new Date().toLocaleDateString('de-DE');
            let subject = 'Betreff';
            let bodyText = '';
            let senderLine = `Signal Iduna - ${user.name} - Münchner Str. 209 - 85757 Karlsfeld`;
            let recipientHTML = `${customer.vorname} ${customer.name}<br>${customer.strasse}<br>${customer.plz} ${customer.ort}`;
            let footerHTML = `<p>Mit freundlichen Grüßen</p><br><br><p>${user.name}<br>Signal Iduna</p>`;

            if (type === 'kuendigung') {
                senderLine = `${customer.vorname} ${customer.name} - ${customer.strasse} - ${customer.plz} ${customer.ort}`;
                recipientHTML = `Signal Iduna<br>Bezirksdirektion ${user.name}<br>Münchner Str. 209<br>85757 Karlsfeld`;
                subject = 'Betreff: Kündigung meiner Versicherung';
                bodyText = `<p>Sehr geehrte Damen und Herren,</p><p>hiermit kündige ich meine Versicherung mit der Versicherungsscheinnummer: _________________________</p><p>zum nächstmöglichen Termin / zum: _________________________.</p><p>Bitte senden Sie mir eine schriftliche Kündigungsbestätigung zu.</p>`;
                footerHTML = `<p>Mit freundlichen Grüßen</p><br><br><p>${customer.vorname} ${customer.name}</p>`;
            } else if (type === 'blanko') {
                subject = 'Betreff: Ihr Anliegen';
                bodyText = `<p>Sehr geehrte(r) ${customer.name},</p><p></p><p></p>`;
            } else if (type === 'rueckruf') {
                subject = 'Betreff: Bitte um Rückruf';
                bodyText = `<p>Sehr geehrte(r) ${customer.name},</p><p>ich habe versucht, Sie telefonisch zu erreichen. Bitte rufen Sie mich zwecks Terminvereinbarung oder Besprechung Ihrer Verträge zurück.</p><p>Vielen Dank.</p>`;
            }

            const htmlContent = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset="utf-8"><title>Dokument</title><style>body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.5}.header{font-size:8pt;text-decoration:underline;margin-bottom:30px;color:#555}.recipient-box{margin-bottom:60px;font-weight:bold}.date{text-align:right;margin-bottom:30px}.subject{font-weight:bold;margin-bottom:20px;font-size:12pt}.footer{margin-top:50px}</style></head>
            <body><div class="header">${senderLine}</div><div class="recipient-box">${recipientHTML}</div><div class="date">Karlsfeld, den ${dateStr}</div><div class="subject">${subject}</div>${bodyText}<div class="footer">${footerHTML}</div></body></html>`;
            
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${type}_${customer.name}.doc`; 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const generatePDF = async (customer, notes = []) => {
            if (!window.jspdf) {
                await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
                    script.onload = resolve;
                    document.body.appendChild(script);
                });
            }
            if (!window.jspdf.jsPDF.prototype.autoTable) {
                await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js";
                    script.onload = resolve;
                    document.body.appendChild(script);
                });
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(0, 122, 255);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("Agenturmanager CRM - Kundenakte", 15, 13);
            doc.setTextColor(60, 60, 60);
            doc.setFontSize(14);
            doc.text(`${customer.anrede} ${customer.vorname} ${customer.name}`, 15, 35);
            doc.setFontSize(10);
            doc.text(`${customer.strasse}\n${customer.plz} ${customer.ort}`, 15, 42);
            const tableBody = customer.verträge.map(v => [ v.sparte, v.gesellschaft + '\n' + v.vsnr, v.beginn + ' - ' + v.ablauf, v.risiken || '-', v.beitrag + ' €' ]);
            doc.autoTable({ startY: 80, head: [['Sparte', 'Gesellschaft / VSNR', 'Laufzeit', 'Risiken', 'Beitrag']], body: tableBody, theme: 'grid' });
            doc.save(`Kunde_${customer.name}.pdf`);
        };

        const generateMockCustomers = (count) => Array.from({ length: count }, (_, i) => ({ id: String(i + 1), anrede: 'Herr', vorname: 'Max', name: 'Mustermann', strasse: 'Musterstr. 1', plz: '12345', ort: 'Musterstadt', telefon: '', handy: '', mail: '', gebDatum: '01.01.1980', zustMA: 'Max Mustermann', adp: '1234', btnr: '00400', notizen: [], verträge: [] }));

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Uncaught error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 flex flex-col items-center justify-center min-h-screen text-center bg-[#F2F2F7]">
                            <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">
                                <AlertTriangle size={48} className="text-red-500 mb-4 mx-auto"/>
                                <h1 className="text-xl font-bold mb-2 text-gray-900">Ein Fehler ist aufgetreten</h1>
                                <p className="text-gray-500 text-sm mb-4">Die App konnte nicht geladen werden.</p>
                                <pre className="bg-gray-50 p-2 rounded text-[10px] text-left w-full overflow-auto mb-6 text-gray-600 border border-gray-100 max-h-32">{this.state.error?.toString()}</pre>
                                <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold w-full active:scale-95 transition-all shadow-lg shadow-blue-200">Neu laden</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- COMPONENTS ---

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bg = type === 'error' ? 'bg-red-50 text-red-900 border-red-200' : 'bg-green-50 text-green-900 border-green-200';
            const icon = type === 'error' ? <AlertCircle size={20} className="text-red-500"/> : <CheckCircle size={20} className="text-green-500"/>;
            return (
                <div className={`fixed top-4 right-4 left-4 md:left-auto z-[100] flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg animate-fade-in ${bg} mt-safe`}>
                    {icon} <span className="font-medium text-sm">{message}</span> <button onClick={onClose}><X size={16} className="opacity-50 hover:opacity-100"/></button>
                </div>
            );
        };

        const ConfirmDialog = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in pb-safe">
                <div className="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm shadow-2xl scale-100">
                    <div className="flex flex-col items-center text-center mb-6">
                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-4"><AlertTriangle size={24} /></div>
                        <h3 className="text-lg font-bold text-gray-900">Bestätigung</h3>
                        <p className="text-sm text-gray-500 mt-2">{message}</p>
                    </div>
                    <div className="flex gap-3">
                        <button onClick={onCancel} className="flex-1 px-4 py-3 sm:py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-base sm:text-sm transition-colors active:scale-95">Abbrechen</button>
                        <button onClick={onConfirm} className="flex-1 px-4 py-3 sm:py-2.5 bg-gray-900 hover:bg-gray-800 text-white font-bold rounded-xl text-base sm:text-sm transition-colors active:scale-95">Bestätigen</button>
                    </div>
                </div>
            </div>
        );

        const IOSCard = React.memo(({ title, children, className = "", noPadding = false, headerAction, onClick }) => (
            <div onClick={onClick} className={`bg-white/80 backdrop-blur-xl border border-white/40 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-3xl overflow-hidden ${className} ${onClick ? 'cursor-pointer hover:shadow-md transition-all active:scale-[0.99]' : ''}`}>
                {title && <div className="px-6 py-4 border-b border-gray-100/50 bg-white/40 backdrop-blur-md flex justify-between items-center"><h3 className="font-bold text-gray-800 text-lg tracking-tight">{title}</h3>{headerAction}</div>}
                <div className={noPadding ? "" : "p-6"}>{children}</div>
            </div>
        ));

        const IOSBadge = React.memo(({ children, color = "blue", className="" }) => {
            const colors = { blue: "bg-blue-100 text-blue-700", green: "bg-green-100 text-green-700", red: "bg-red-100 text-red-700", amber: "bg-amber-100 text-amber-700", gray: "bg-gray-100 text-gray-700", purple: "bg-purple-100 text-purple-700" };
            return <span className={`px-3 py-1 rounded-full text-xs font-semibold ${colors[color]} ${className}`}>{children}</span>;
        });

        const IOSButton = React.memo(({ children, onClick, variant = "primary", className = "", icon: Icon, disabled, type="button" }) => {
            const variants = { primary: "bg-[#007AFF] hover:bg-[#0066CC] text-white shadow-blue-500/20", secondary: "bg-gray-100 hover:bg-gray-200 text-gray-800", danger: "bg-red-500 hover:bg-red-600 text-white shadow-red-500/20", ghost: "bg-transparent hover:bg-gray-100 text-gray-600" };
            return <button type={type} onClick={onClick} disabled={disabled} className={`px-4 py-3 sm:py-2.5 rounded-full font-medium text-base sm:text-sm transition-all active:scale-95 flex items-center justify-center gap-2 ${variants[variant]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>{Icon && <Icon size={18} />}{children}</button>;
        });

        // Using text-base on mobile to prevent zooming
        const IOSInput = React.memo((props) => <input {...props} className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-gray-800 focus:ring-2 focus:ring-[#007AFF]/20 focus:bg-white outline-none text-base transition-all" />);

        const StatCard = React.memo(({ icon: Icon, label, value, color, onClick }) => (
            <div onClick={onClick} className={`bg-white/80 backdrop-blur-xl p-6 rounded-3xl border border-white/60 shadow-sm flex items-center justify-between ${onClick ? 'cursor-pointer hover:bg-white hover:shadow-md transition-all active:scale-95' : ''}`}>
                <div><p className="text-sm font-medium text-gray-500 mb-1">{label}</p><p className="text-3xl font-bold text-gray-900">{value}</p></div>
                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${color}`}><Icon size={24} className="text-white" /></div>
            </div>
        ));

        const LoginView = ({ onLogin, loginError, isLoggingIn, loadingProgress, debugUsers, onClearError }) => {
            const [pin, setPin] = useState('');
            const [isLongWait, setIsLongWait] = useState(false);
            
            // Effect: Show reset button if loading takes too long
            useEffect(() => {
                let timer;
                if (isLoggingIn) {
                    timer = setTimeout(() => setIsLongWait(true), 5000);
                } else {
                    setIsLongWait(false);
                }
                return () => clearTimeout(timer);
            }, [isLoggingIn]);

            // Effect to clear PIN after error with delay
            useEffect(() => {
                if (loginError) {
                    const timer = setTimeout(() => {
                        setPin('');
                    }, 2500); // 2.5s delay for reading
                    return () => clearTimeout(timer);
                }
            }, [loginError]);

            const handleNumClick = (num) => {
                if (loginError) onClearError(); // Clear parent error immediately
                if (pin.length >= 4) return;
                const next = pin + num;
                setPin(next);
                if (next.length === 4) {
                    // Small delay to render the 4th dot before submitting
                    setTimeout(() => onLogin(next), 50);
                }
            };
            
            if (isLoggingIn) {
                return (
                <div className="min-h-screen bg-[#F2F2F7] flex flex-col items-center justify-center p-6 animate-fade-in pb-safe">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-xl flex flex-col items-center w-full max-w-sm text-center">
                        <RefreshCw className="w-12 h-12 text-[#007AFF] animate-spin mb-6" />
                        <h2 className="text-xl font-bold text-gray-800 mb-2">Anmeldung läuft...</h2>
                        <p className="text-sm text-gray-500 mb-4">{debugUsers?.length > 0 ? "Datenbank bereit" : "Warte auf Datenbank..."}</p>
                        <div className="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden border border-gray-100">
                            <div className="bg-[#007AFF] h-full rounded-full transition-all duration-300 ease-out" style={{ width: `${Math.max(5, loadingProgress)}%` }}></div>
                        </div>
                        <p className="text-[#007AFF] font-bold font-mono text-lg">{loadingProgress}%</p>
                        
                        {isLongWait && (
                            <button onClick={() => window.location.reload()} className="mt-6 text-red-500 text-sm font-medium hover:underline animate-fade-in">
                                Dauert zu lange? Neu laden.
                            </button>
                        )}
                    </div>
                </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F2F2F7] flex items-center justify-center p-6 animate-fade-in font-sans pb-safe">
                <div className="w-full max-w-sm flex flex-col items-center">
                    <div className={`bg-white/90 backdrop-blur-2xl p-8 rounded-[2.5rem] shadow-[0_20px_40px_rgb(0,0,0,0.1)] border border-white/50 text-center w-full transition-all duration-300 ${loginError ? 'animate-shake border-red-300 ring-4 ring-red-100' : ''}`}>
                        <div className="w-16 h-16 bg-gradient-to-tr from-[#007AFF] to-[#5AC8FA] rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-500/30"><Shield className="w-8 h-8 text-white" /></div>
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">Willkommen</h1>
                        <p className="text-gray-500 mb-6 font-medium text-sm">Bitte 4-stelligen PIN eingeben</p>
                        
                        <div className="flex justify-center gap-4 mb-8">
                            {[0, 1, 2, 3].map((idx) => <div key={idx} className={`w-4 h-4 rounded-full transition-all duration-300 ${idx < pin.length ? 'bg-[#007AFF] scale-110' : 'bg-gray-200'} ${loginError ? 'bg-red-500' : ''}`} />)}
                        </div>
                        
                        {loginError && (
                            <div className="bg-red-50 border border-red-100 rounded-xl p-3 mb-6 animate-fade-in">
                                <p className="text-red-600 text-xs font-bold uppercase tracking-wider mb-1">Fehler</p>
                                <p className="text-red-800 text-sm font-medium">{loginError}</p>
                            </div>
                        )}

                        <div className="grid grid-cols-3 gap-4 mb-4">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => <button key={num} onClick={() => handleNumClick(num)} className="h-16 rounded-2xl bg-gray-50 text-2xl font-semibold text-gray-700 hover:bg-gray-100 active:scale-95 transition-all shadow-sm border border-gray-100 active:bg-gray-200">{num}</button>)}
                            <button onClick={() => { setPin(''); onClearError(); }} className="h-16 rounded-2xl bg-red-50 text-red-500 text-lg font-bold hover:bg-red-100 active:scale-95 flex items-center justify-center">C</button>
                            <button onClick={() => handleNumClick(0)} className="h-16 rounded-2xl bg-gray-50 text-xl font-semibold text-gray-700 hover:bg-gray-100 active:scale-95 shadow-sm border border-gray-100 active:bg-gray-200">0</button>
                            <button onClick={() => { setPin(prev => prev.slice(0, -1)); onClearError(); }} className="h-16 rounded-2xl bg-gray-50 text-gray-500 hover:bg-gray-100 active:scale-95 flex items-center justify-center border border-gray-100"><ArrowLeft size={24} /></button>
                        </div>
                    </div>
                    <div className="mt-6 text-gray-400 text-xs font-mono opacity-60 text-center">
                        <p>AgenturManager {APP_VERSION}</p>
                        <p className="mt-1 text-[10px]">DB Status: {debugUsers?.length || 0} User</p>
                    </div>
                </div>
                </div>
            );
        };

        const TasksWidget = React.memo(({ tasks, currentUser, onUpdateTask, onDeleteTask, onShowTaskModal, allUsers, isModal }) => {
            const [activeTab, setActiveTab] = useState('open');
            const displayedTasks = useMemo(() => {
                if (!currentUser) return [];
                let filtered = tasks.filter(t => { 
                    if (currentUser.role !== 'admin' && t.assignedTo !== currentUser.name && t.assignedTo !== 'Alle') return false; 
                    return true; 
                });
                if (activeTab === 'open') filtered = filtered.filter(t => t.status !== 'done'); else filtered = filtered.filter(t => t.status === 'done');
                return filtered.sort((a,b) => (a.dueDate > b.dueDate ? 1 : -1));
            }, [tasks, activeTab, currentUser]);

            return (
                <div className="flex flex-col h-full">
                    {isModal && (
                        <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                            <div className="flex gap-4">
                                <button onClick={() => setActiveTab('open')} className={`text-sm font-bold pb-2 border-b-2 ${activeTab === 'open' ? 'text-blue-600 border-blue-600' : 'text-gray-400 border-transparent'}`}>Offen</button>
                                <button onClick={() => setActiveTab('done')} className={`text-sm font-bold pb-2 border-b-2 ${activeTab === 'done' ? 'text-green-600 border-green-600' : 'text-gray-400 border-transparent'}`}>Erledigt</button>
                            </div>
                            <IOSButton onClick={() => onShowTaskModal(true)} icon={Plus} className="!py-1.5 !px-3 text-xs">Neu</IOSButton>
                        </div>
                    )}
                    <div className="overflow-y-auto flex-1 space-y-2 pr-1 pb-4">
                        {displayedTasks.length === 0 ? <div className="h-40 flex flex-col items-center justify-center text-gray-400"><CheckCircle size={48} className="mb-2 opacity-20" /><p>Keine {activeTab === 'open' ? 'offenen' : 'erledigten'} Aufgaben</p></div> : 
                            displayedTasks.map(task => (
                                <div key={task.id} className={`p-4 rounded-xl border transition-all ${task.status === 'done' ? 'bg-gray-50 opacity-75' : 'bg-white shadow-sm'}`}>
                                    <div className="flex items-start gap-3">
                                        <button onClick={() => onUpdateTask(task.id, task.status === 'done' ? 'open' : 'done')} className={`mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center ${task.status === 'done' ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300'}`}>{task.status === 'done' ? <RefreshCw size={14} /> : <CheckCircle size={14} />}</button>
                                        <div className="flex-1">
                                            <div className="flex justify-between items-start">
                                                <p className={`font-bold ${task.status === 'done' ? 'text-gray-500 line-through' : 'text-gray-800'}`}>{task.title}</p>
                                                <span className="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full whitespace-nowrap">{task.dueDate}</span>
                                            </div>
                                            <p className="text-sm text-gray-500 mt-1">{task.description}</p>
                                            <div className="mt-2 flex justify-between items-center">
                                                <span className="text-[10px] text-gray-400 bg-gray-50 px-2 py-1 rounded-md">für {task.assignedTo}</span>
                                                {currentUser?.role === 'admin' && <button onClick={(e) => { e.stopPropagation(); onDeleteTask(task.id); }} className="text-gray-300 hover:text-red-500 p-2"><Trash2 size={16} /></button>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))
                        }
                    </div>
                </div>
            );
        });

        const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
        const getBavarianHolidays = (year) => {
            const holidays = {};
            const fixed = { '01-01': 'Neujahr', '01-06': 'Hl. Drei Könige', '05-01': 'Tag der Arbeit', '08-15': 'Mariä Himmelfahrt', '10-03': 'Tag d. Dt. Einheit', '11-01': 'Allerheiligen', '12-25': '1. Weihnachtstag', '12-26': '2. Weihnachtstag' };
            Object.keys(fixed).forEach(k => holidays[`${year}-${k}`] = fixed[k]);
            const a = year % 19, b = Math.floor(year/100), c = year%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451), n = Math.floor((h+l-7*m+114)/31), p = (h+l-7*m+114)%31;
            const easter = new Date(year, n-1, p+1);
            const add = (days) => { const d = new Date(easter); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; };
            holidays[add(-2)] = 'Karfreitag'; holidays[add(1)] = 'Ostermontag'; holidays[add(39)] = 'Christi Himmelfahrt'; holidays[add(50)] = 'Pfingstmontag'; holidays[add(60)] = 'Fronleichnam';
            return holidays;
        };
        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            try { const [h1, m1] = start.split(':').map(Number); const [h2, m2] = end.split(':').map(Number); return Math.max(0, (h2 + m2/60) - (h1 + m1/60)); } catch (e) { return 0; }
        };

        const ShiftModal = ({ isOpen, onClose, onSave, onDelete, initialData, selectedDate, selectedUser, users }) => {
            if (!isOpen) return null;
            
            const handlePreset = (e, type) => {
                e.preventDefault(); e.stopPropagation();
                let start = '', end = '';
                if (type === 'früh') { start = '09:00'; end = '13:00'; }
                else if (type === 'spät') { start = '13:00'; end = '18:00'; }
                else if (type === 'freitag_frueh') { start = '09:00'; end = '12:00'; } 
                else if (type === 'freitag_spaet') { start = '12:00'; end = '15:00'; } 
                const form = document.getElementById('shift-form');
                const userId = form.userId ? form.userId.value : selectedUser?.id;
                if(!userId) { alert("Bitte Mitarbeiter wählen"); return; }
                onSave({ type, start, end, userId });
            };

            const handleCustomSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                if(!fd.get('userId') && !selectedUser) { alert("Bitte Mitarbeiter wählen"); return; }
                onSave({ type: 'custom', start: fd.get('start'), end: fd.get('end'), userId: fd.get('userId') || selectedUser.id });
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in pb-safe" onClick={onClose}>
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm shadow-2xl scale-100" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <div><h3 className="text-lg font-bold">Schichtplanung</h3><p className="text-xs text-gray-500">{selectedDate}</p></div>
                            <button onClick={onClose} className="p-2 bg-gray-100 rounded-full"><X size={16}/></button>
                        </div>
                        <form id="shift-form" onSubmit={handleCustomSubmit} className="space-y-4">
                            {!selectedUser && (
                                <div className="bg-gray-50 p-2 rounded-xl border border-gray-200">
                                    <label className="text-xs font-bold text-gray-500 uppercase block mb-1 px-1">Mitarbeiter</label>
                                    <select name="userId" className="w-full bg-transparent outline-none text-base font-bold p-1">
                                        <option value="">Bitte wählen...</option>
                                        {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                    </select>
                                </div>
                            )}
                            {selectedUser && <p className="font-bold text-center bg-blue-50 text-blue-800 p-2 rounded-xl">{selectedUser.name}</p>}

                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={(e) => handlePreset(e, 'früh')} className="bg-blue-50 text-blue-700 hover:bg-blue-100 py-3 rounded-xl font-bold text-sm flex flex-col items-center"><span>Früh</span><span className="text-[9px] opacity-60">09-13</span></button>
                                <button type="button" onClick={(e) => handlePreset(e, 'spät')} className="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 py-3 rounded-xl font-bold text-sm flex flex-col items-center"><span>Spät</span><span className="text-[9px] opacity-60">13-18</span></button>
                                <button type="button" onClick={(e) => handlePreset(e, 'freitag_frueh')} className="bg-cyan-50 text-cyan-700 hover:bg-cyan-100 py-3 rounded-xl font-bold text-sm flex flex-col items-center"><span>FR Früh</span><span className="text-[9px] opacity-60">09-12</span></button>
                                <button type="button" onClick={(e) => handlePreset(e, 'freitag_spaet')} className="bg-purple-50 text-purple-700 hover:bg-purple-100 py-3 rounded-xl font-bold text-sm flex flex-col items-center"><span>FR Spät</span><span className="text-[9px] opacity-60">12-15</span></button>
                                <button type="button" onClick={(e) => handlePreset(e, 'urlaub')} className="bg-green-100 text-green-700 hover:bg-green-200 py-3 rounded-xl font-bold text-sm">Urlaub</button>
                                <button type="button" onClick={(e) => handlePreset(e, 'krank')} className="bg-red-100 text-red-700 hover:bg-red-200 py-3 rounded-xl font-bold text-sm">Krank</button>
                            </div>
                            <div className="border-t border-gray-100 pt-3">
                                <p className="text-xs text-gray-400 font-bold uppercase mb-2">Manuelle Zeit</p>
                                <div className="flex gap-2">
                                    <input name="start" type="time" defaultValue={initialData?.start} className="bg-gray-50 rounded-lg px-2 py-2 text-base border border-gray-200 w-full"/>
                                    <input name="end" type="time" defaultValue={initialData?.end} className="bg-gray-50 rounded-lg px-2 py-2 text-base border border-gray-200 w-full"/>
                                </div>
                                <button type="submit" className="mt-4 w-full py-3 bg-gray-800 text-white rounded-xl text-sm font-bold active:scale-95 transition-all">Speichern</button>
                            </div>
                            {initialData && <button type="button" onClick={onDelete} className="w-full py-2 text-red-500 text-sm font-bold flex items-center justify-center gap-2 hover:bg-red-50 rounded-xl"><Trash2 size={16}/> Löschen</button>}
                        </form>
                    </div>
                </div>
            );
        };

        const RosterStats = ({ users, shifts, currentYear, currentMonth }) => {
            const stats = useMemo(() => {
                return users.map(user => {
                    const userShifts = shifts.filter(s => s.userId === user.id);
                    const monthHours = userShifts.reduce((sum, s) => {
                        const d = new Date(s.date);
                        if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) return sum + calculateDuration(s.start, s.end);
                        return sum;
                    }, 0);
                    const yearHours = userShifts.reduce((sum, s) => {
                        const d = new Date(s.date);
                        if (d.getFullYear() === currentYear) return sum + calculateDuration(s.start, s.end);
                        return sum;
                    }, 0);
                    return { ...user, monthHours, yearHours };
                }).sort((a,b) => b.monthHours - a.monthHours);
            }, [users, shifts, currentYear, currentMonth]);

            return (
                <div className="mt-8 bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden p-6">
                    <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Activity size={20} className="text-blue-500"/> Auswertung</h3>
                    <table className="w-full text-sm text-left">
                        <thead className="bg-gray-50 text-gray-500 font-bold uppercase text-xs"><tr><th className="p-3">Mitarbeiter</th><th className="p-3 text-right">Monat</th><th className="p-3 text-right">Jahr</th></tr></thead>
                        <tbody className="divide-y divide-gray-100">
                            {stats.map(s => <tr key={s.id}><td className="p-3 font-medium">{s.name}</td><td className="p-3 text-right font-bold text-blue-600">{s.monthHours.toFixed(1)} h</td><td className="p-3 text-right text-gray-600">{s.yearHours.toFixed(1)} h</td></tr>)}
                        </tbody>
                    </table>
                </div>
            );
        };

        const RosterView = React.memo(({ users, shifts, closings, currentUser, onSaveShift, onDeleteShift, onToggleClosing }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedShift, setSelectedShift] = useState(null); 
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const holidays = useMemo(() => getBavarianHolidays(year), [year]);
            const canEdit = currentUser.role === 'admin' || currentUser.canEditRoster;
            
            // Filter inactive users from Roster completely
            const activeRosterUsers = useMemo(() => users.filter(u => !u.hidden), [users]);

            const firstDayIndex = new Date(year, month, 1).getDay(); 
            const startOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 

            const handleDayClick = (day) => {
                if (!canEdit) return;
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                setSelectedShift({ userId: null, dateStr, dayDisplay: `${day}.${month+1}.${year}`, isNew: true });
            };

            const handleShiftClick = (e, shift) => {
                e.stopPropagation();
                if (!canEdit) return;
                const user = users.find(u => u.id === shift.userId);
                setSelectedShift({ userId: shift.userId, dateStr: shift.date, shift, user, dayDisplay: `${new Date(shift.date).getDate()}.${new Date(shift.date).getMonth()+1}.${new Date(shift.date).getFullYear()}` });
            };

            const handleHeaderClick = (e, dateStr) => { e.stopPropagation(); if (canEdit) onToggleClosing(dateStr); };

            return (
                <div className="animate-fade-in flex flex-col h-full pb-10">
                    <div className="flex justify-between items-center mb-6 sticky top-0 bg-[#F2F2F7] z-10 py-2">
                        <h2 className="text-2xl font-bold">Dienstplan</h2>
                        <div className="flex items-center gap-4 bg-white rounded-xl p-1 shadow-sm border border-gray-100">
                            <button onClick={() => setCurrentDate(new Date(year, month - 1))} className="p-2 hover:bg-gray-100 rounded-lg active:bg-gray-200"><ChevronLeft size={20}/></button>
                            <span className="font-bold min-w-[120px] text-center text-sm sm:text-base">{monthNames[month]} {year}</span>
                            <button onClick={() => setCurrentDate(new Date(year, month + 1))} className="p-2 hover:bg-gray-100 rounded-lg active:bg-gray-200"><ChevronRight size={20}/></button>
                        </div>
                    </div>

                    {/* CALENDAR GRID - Responsive Handling */}
                    <div className="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                        <div className="hidden md:grid grid-cols-7 bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-500 uppercase text-center p-2"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
                        <div className="flex flex-col md:grid md:grid-cols-7 md:auto-rows-fr">
                            {Array.from({ length: startOffset }).map((_, i) => <div key={`empty-${i}`} className="hidden md:block border-r border-b border-gray-100 bg-gray-50/30 min-h-[100px]"></div>)}
                            {days.map(d => {
                                const date = new Date(year, month, d);
                                const dateStr = date.toISOString().split('T')[0];
                                const isHoliday = holidays[dateStr];
                                const isClosed = closings.includes(dateStr);
                                const dayShifts = shifts.filter(s => s.date === dateStr);
                                
                                return (
                                    <div key={d} className={`relative border-b md:border-r border-gray-100 p-2 sm:p-1 min-h-[60px] md:min-h-[90px] transition-colors ${isClosed ? 'bg-gray-100 pattern-diagonal-stripes' : 'bg-white'} ${isHoliday ? 'bg-red-50/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-1">
                                            <div className="flex items-center gap-2">
                                                <span onClick={(e) => handleHeaderClick(e, dateStr)} className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full cursor-pointer hover:bg-gray-200 ${isHoliday ? 'bg-red-100 text-red-600' : 'text-gray-700'} ${dateStr === new Date().toISOString().split('T')[0] ? 'bg-blue-600 text-white shadow-md' : ''}`}>{d}</span>
                                                <span className="md:hidden text-xs text-gray-400 font-medium">{date.toLocaleDateString('de-DE', {weekday: 'short'})}</span>
                                                {isHoliday && <span className="md:hidden text-[10px] text-red-500 truncate max-w-[100px]">{holidays[dateStr]}</span>}
                                            </div>
                                            {isClosed && <CalendarX size={14} className="text-gray-400"/>}
                                            {canEdit && !isClosed && <button onClick={() => handleDayClick(d)} className="p-1 text-gray-300 hover:text-blue-600 transition-colors active:text-blue-800"><Plus size={16}/></button>}
                                        </div>
                                        {!isClosed && (
                                            <div className="space-y-1 pl-1">
                                                {dayShifts.map(shift => {
                                                    const u = users.find(user => user.id === shift.userId);
                                                    if (!u || u.hidden) return null; 
                                                    let badgeClass = "bg-gray-100 text-gray-700";
                                                    if (shift.type === 'früh') badgeClass = "bg-blue-100 text-blue-800";
                                                    if (shift.type === 'spät') badgeClass = "bg-indigo-100 text-indigo-800";
                                                    if (shift.type === 'freitag_frueh') badgeClass = "bg-cyan-100 text-cyan-800";
                                                    if (shift.type === 'freitag_spaet') badgeClass = "bg-purple-100 text-purple-800";
                                                    if (shift.type === 'urlaub') badgeClass = "bg-green-100 text-green-800";
                                                    if (shift.type === 'krank') badgeClass = "bg-red-100 text-red-800";
                                                    return (
                                                        <div key={shift.id} onClick={(e) => handleShiftClick(e, shift)} className={`text-[11px] px-2 py-1.5 rounded-lg cursor-pointer flex justify-between items-center leading-tight ${badgeClass} ${canEdit ? 'active:opacity-70' : ''}`}>
                                                            <span className="font-bold truncate">{getFirstName(u.name)}</span>
                                                            <span className="opacity-80 font-mono text-[9px]">{shift.start}-{shift.end}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                        {isHoliday && <div className="absolute bottom-1 right-1 text-[8px] text-red-400 font-medium md:block hidden">{holidays[dateStr]}</div>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {canEdit && <RosterStats users={activeRosterUsers} shifts={shifts} currentYear={year} currentMonth={month} />}

                    <ShiftModal isOpen={!!selectedShift} onClose={() => setSelectedShift(null)} selectedDate={selectedShift?.dayDisplay} selectedUser={selectedShift?.user} users={activeRosterUsers} initialData={selectedShift?.shift} onSave={(data) => { onSaveShift({ ...data, date: selectedShift.dateStr, id: selectedShift.shift?.id }); setSelectedShift(null); }} onDelete={() => { if(selectedShift.shift?.id) onDeleteShift(selectedShift.shift.id); setSelectedShift(null); }} />
                </div>
            );
        });

                    if (!window.Papa) { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js'; s.onload = parse; document.body.appendChild(s); } else parse();
                };
                reader.readAsText(file);
            };

            const processCSVData = async (data) => {
                const grouped = {};

                    const adpCol = getColumnValue(row, ['ADP', 'AD-Nummer'])||'';
                    let finalAgentName = 'Unzugewiesen';
                    if (adpCol) finalAgentName = `Vermittler ${adpCol}`; 
                    
                    const key = generateStableId(vorname, name, gebDatum) || `row-${idx}`;
                    const contract = { sparte: getColumnValue(row, ['Sparte'])||'-', gesellschaft: getColumnValue(row, ['Gesellschaft'])||'-', vsnr: getColumnValue(row, ['VSNR'])||'-', status: 'Aktiv', beginn: formatDateToGerman(getColumnValue(row, ['Beginn'])), ablauf: formatDateToGerman(getColumnValue(row, ['Ablauf'])), beitrag: getColumnValue(row, ['Beitrag'])||'0', mob: '0', zahlweise: getColumnValue(row, ['Zahlweise'])||'-', risiken: getColumnValue(row, ['Risiken'])||'-' };
                    
                    if (grouped[key]) grouped[key].verträge.push(contract);
                    else grouped[key] = { id: key, anrede: getColumnValue(row, ['Anrede']), vorname, name, strasse: getColumnValue(row, ['Straße']), plz: getColumnValue(row, ['PLZ']), ort: getColumnValue(row, ['Ort']), telefon: getColumnValue(row, ['Telefon']), mail: getColumnValue(row, ['Mail']), gebDatum, zustMA: finalAgentName, adp: adpCol, notizen: [], verträge: [contract] };
                });

                const finalData = Object.values(grouped);
                setRawCustomers(finalData);
                try { localStorage.setItem('crm_data_cache', JSON.stringify(finalData)); } catch (e) {}
                return finalData.length;
            };

            const addNote = async (cid, txt) => { 
                if (!firebaseUser || !db) return; 
                const newNotes = [...(notesMap[cid]||[]), { text: txt, author: currentUser.name, date: new Date().toLocaleDateString() }]; 
                setNotesMap(prev => ({...prev, [cid]: newNotes}));

            const onImportCustomersLocal = (e) => {

                        const parse = () => window.Papa.parse(evt.target.result, { header: true, skipEmptyLines: 'greedy', complete: async (res) => await processCSVData(res.data) });

            const saveUser = async (userData) => {

                else newAllowed = [...currentAllowed, targetId]; 
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', permissionsTargetUser.id), { allowedToView: newAllowed }); 
                setPermissionsTargetUser({...permissionsTargetUser, allowedToView: newAllowed}); 
            };

            const fetchGoogleData = async (inputUrl, isAutoLoad = false) => { 
                if (!inputUrl) return; 
                setIsImporting(true); setImportError(null); setLoadingProgress(10); 
                let targetUrl = inputUrl; 
                if (inputUrl.includes('docs.google.com')) {
                    const idMatch = inputUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    if (idMatch && idMatch[1] && !inputUrl.includes('pub?')) targetUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
                }
                const cacheBuster = (targetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
                const finalTargetUrl = targetUrl + cacheBuster;
                const strategies = [ { name: "Direkt", url: finalTargetUrl }, { name: "ProxyIO", url: `https://corsproxy.io/?${encodeURIComponent(finalTargetUrl)}` }, { name: "CodeTabs", url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(finalTargetUrl)}` } ];
                
                let csvContent = null;
                for (const strat of strategies) {
                    try {
                        const res = await fetch(strat.url);
                        if (!res.ok) continue; 
                        const txt = await res.text();
                        if (txt.includes('<!DOCTYPE') || txt.length < 10) continue;

                    } catch (e) {}
                }

            };
