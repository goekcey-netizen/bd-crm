<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenturManager CRM</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel für JSX Kompilierung im Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles für Animationen & Schraffur -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #F2F2F7; overflow-x: hidden; width: 100%; }
        #root { width: 100%; overflow-x: hidden; }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Schraffur für geschlossene Tage */
        .pattern-diagonal-stripes {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, #e5e7eb 5px, #e5e7eb 10px);
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }

        @keyframes slide-in-right {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-in { animation: slide-in-right 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }

        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-in { animation: scale-in 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- App Script -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Lucide Icons Import via ESM
        import { 
            Users, LayoutDashboard, Lock, Shield, 
            Search, Calendar, LogOut, Upload, Plus, 
            X, User, Save, CheckCircle, AlertCircle,
            Briefcase, FileSpreadsheet, Link as LinkIcon, RefreshCw, AlertTriangle, Copy,
            ChevronRight, Phone, Mail, MapPin, Trash2, RotateCcw, Eye, EyeOff, Edit3, ExternalLink, Filter, Activity,
            FileText, Download, Share2, Circle, ChevronDown, ArrowLeft, Loader2, ChevronLeft, Info,
            ClipboardList, Menu, Clock, CalendarX, Printer
        } from 'https://esm.sh/lucide-react@0.344.0';

        // Firebase Imports
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { 
            getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, 
            onSnapshot, query, setDoc, getDoc, where, getDocs, writeBatch, 
            orderBy, limit 
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

        // --- UI COMPONENTS (TOAST & MODAL) ---

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bg = type === 'error' ? 'bg-red-50 text-red-900 border-red-200' : 'bg-green-50 text-green-900 border-green-200';
            const icon = type === 'error' ? <AlertCircle size={20} className="text-red-500"/> : <CheckCircle size={20} className="text-green-500"/>;

            return (
                <div className={`fixed top-4 right-4 z-[100] flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg animate-fade-in ${bg}`}>
                    {icon}
                    <span className="font-medium text-sm">{message}</span>
                    <button onClick={onClose}><X size={16} className="opacity-50 hover:opacity-100"/></button>
                </div>
            );
        };

        const ConfirmDialog = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in">
                <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl scale-100">
                    <div className="flex flex-col items-center text-center mb-6">
                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-4">
                            <AlertTriangle size={24} />
                        </div>
                        <h3 className="text-lg font-bold text-gray-900">Bestätigung</h3>
                        <p className="text-sm text-gray-500 mt-2">{message}</p>
                    </div>
                    <div className="flex gap-3">
                        <button onClick={onCancel} className="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition-colors">Abbrechen</button>
                        <button onClick={onConfirm} className="flex-1 px-4 py-2.5 bg-gray-900 hover:bg-gray-800 text-white font-bold rounded-xl text-sm transition-colors">Bestätigen</button>
                    </div>
                </div>
            </div>
        );

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Uncaught error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center h-screen bg-red-50 p-6 text-center">
                            <AlertTriangle className="w-12 h-12 text-red-500 mb-4" />
                            <h1 className="text-xl font-bold text-red-700 mb-2">Etwas ist schief gelaufen</h1>
                            <p className="text-red-600 mb-4 text-sm max-w-md">{this.state.error?.message}</p>
                            <button onClick={() => window.location.reload()} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Neu laden</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- FIREBASE SETUP ---
        let app, auth, db, initError;
        const __firebase_config = window.__firebase_config; 
        const __app_id = window.__app_id;
        const __initial_auth_token = window.__initial_auth_token;

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } else {
                const fallbackConfig = {
                    apiKey: "AIzaSyAtuk5zW_Q4K65ANwuANPypwmmvSOQfKlA",
                    authDomain: "agenturmanager-96ff4.firebaseapp.com",
                    projectId: "agenturmanager-96ff4",
                    storageBucket: "agenturmanager-96ff4.firebasestorage.app",
                    messagingSenderId: "510352845810",
                    appId: "1:510352845810:web:5ad373711c092465d3996b"
                };
                app = initializeApp(fallbackConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Firebase Init Fehler:", e);
            initError = e;
        }

        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'agenturmanager-crm';

        // --- HELPERS & HOOKS ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        const parseAnyDate = (dateStr) => {
            if (!dateStr) return null;
            if (dateStr.includes('-')) {
                const [year, month, day] = dateStr.split('-');
                return new Date(year, month - 1, day);
            }
            if (dateStr.includes('.')) {
                const [day, month, year] = dateStr.split('.');
                return new Date(year, month - 1, day);
            }
            return null;
        };

        const formatDateToGerman = (dateInput) => {
            if (!dateInput) return '';
            let date = dateInput;
            if (typeof dateInput === 'string') date = parseAnyDate(dateInput);
            if (!date || isNaN(date.getTime())) return dateInput;
            
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}.${m}.${y}`;
        };

        const formatDateTime = (isoString) => {
            if (!isoString) return '-';
            try {
                const d = new Date(isoString);
                return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch(e) { return '-'; }
        };

        const normalizeName = (name) => { if (!name) return ''; return name.replace(/[:.;,]/g, ' ').replace(/\s+/g, ' ').trim(); };
        const getFirstName = (fullName) => { if (!fullName) return ''; if (fullName.includes(',')) { const parts = fullName.split(','); if (parts.length > 1) return parts[1].trim().split(' ')[0]; } return fullName.split(' ')[0]; };
        const normalizeNumber = (val) => { if(!val) return ''; return String(val).replace(/[^0-9]/g, '').replace(/^0+/, ''); };

        const generateUserId = (name) => {
            const map = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' };
            let cleanName = normalizeName(name).toLowerCase();
            cleanName = cleanName.replace(/[äöüß]/g, m => map[m]);
            const id = cleanName.replace(/[^a-z0-9]/g, '_');
            return id || 'user_' + Math.floor(Math.random() * 10000);
        };

        const generateStableId = (vorname, name, gebDatum) => {
            const raw = `${vorname}|${name}|${gebDatum}`.toLowerCase().replace(/[^a-z0-9]/g, '');
            return raw || 'unknown-' + Math.random();
        };

        const checkMatch = (user, customer) => {
            if (!user || !customer) return false;
            if (user.role === 'admin') return true;
            const userAdv = normalizeNumber(user.adv);
            const custAdp = normalizeNumber(customer.adp); 
            const custBtnr = normalizeNumber(customer.btnr); 
            const userBtnr = normalizeNumber(user.btnr);

            if (userAdv.length > 2) {
                if (custAdp && (userAdv.includes(custAdp) || custAdp.includes(userAdv))) return true;
                if (custBtnr && (userAdv.includes(custBtnr) || custBtnr.includes(userAdv))) return true;
            }
            if (userBtnr.length > 2) {
                if (custAdp && (userBtnr.includes(custAdp) || custAdp.includes(userBtnr))) return true;
                if (custBtnr && (userBtnr.includes(custBtnr) || custBtnr.includes(userBtnr))) return true;
            }
            const userName = normalizeName(user.name).toLowerCase();
            const custAdpName = normalizeName(customer.adp).toLowerCase(); 
            if (userName.length > 2) {
                if (custAdpName.includes(userName)) return true;
            }
            return false;
        };

        const checkAnyMatch = (allowedUsersList, customer) => {
            if (!allowedUsersList || !Array.isArray(allowedUsersList)) return false;
            return allowedUsersList.some(user => checkMatch(user, customer));
        };

        const isBirthdayUpcoming = (dateStr) => {
            const dob = parseAnyDate(dateStr);
            if (!dob) return false;
            const today = new Date();
            const nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
            if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);
            const diffDays = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24)); 
            return diffDays >= 0 && diffDays <= 30;
        };

        const getNextBirthdayDate = (dateStr) => {
            const dob = parseAnyDate(dateStr);
            if (!dob) return new Date(9999, 11, 31);
            const today = new Date();
            const nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
            if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);
            return nextBirthday;
        };

        const isExpiringSoon = (dateStr) => {
            const expiry = parseAnyDate(dateStr);
            if (!expiry) return false;
            const today = new Date();
            const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
            return diffDays > 0 && diffDays <= 90;
        };

        const getColumnValue = (row, searchTerms) => {
            const keys = Object.keys(row);
            for (const term of searchTerms) {
                if (row[term] !== undefined && row[term] !== null && row[term] !== '') return row[term];
            }
            for (const term of searchTerms) {
                const matchingKey = keys.find(k => k.toLowerCase().trim() === term.toLowerCase());
                if (matchingKey && row[matchingKey] !== undefined && row[matchingKey] !== null && row[matchingKey] !== '') return row[matchingKey];
            }
            return '';
        };

        const analyzeGaps = (contracts) => {
            const currentTypes = contracts.map(c => c.sparte.toLowerCase());
            const gaps = [];
            if (!currentTypes.some(t => t.includes('haftpflicht') || t.includes('phv'))) gaps.push('Privathaftpflicht');
            if (!currentTypes.some(t => t.includes('hausrat') || t.includes('vhr'))) gaps.push('Hausrat');
            if (!currentTypes.some(t => t.includes('wohngebäude') || t.includes('gebäude'))) gaps.push('Wohngebäude');
            if (!currentTypes.some(t => t.includes('kfz') || t.includes('auto') || t.includes('fahrzeug'))) gaps.push('KFZ');
            if (!currentTypes.some(t => t.includes('rechts') || t.includes('rs'))) gaps.push('Rechtsschutz');
            if (!currentTypes.some(t => t.includes('unfall'))) gaps.push('Unfall');
            return gaps;
        };

        const generatePDF = async (customer, notes = []) => {
            if (!window.jspdf) {
                await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
                    script.onload = resolve;
                    document.body.appendChild(script);
                });
            }
            if (!window.jspdf.jsPDF.prototype.autoTable) {
                await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js";
                    script.onload = resolve;
                    document.body.appendChild(script);
                });
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const colorPrimary = [0, 122, 255]; 
            const colorText = [60, 60, 60];

            doc.setFillColor(...colorPrimary);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.setFont("helvetica", "bold");
            doc.text("Agenturmanager CRM - Kundenakte", 15, 13);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            const dateStr = new Date().toLocaleDateString('de-DE');
            doc.text(`Stand: ${dateStr}`, 195, 13, { align: 'right' });
            doc.setTextColor(...colorText);
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text(`${customer.anrede} ${customer.vorname} ${customer.name}`, 15, 35);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`${customer.strasse}`, 15, 42);
            doc.text(`${customer.plz} ${customer.ort}`, 15, 47);
            doc.setDrawColor(200, 200, 200);
            doc.setFillColor(250, 250, 250);
            doc.roundedRect(120, 30, 75, 35, 3, 3, 'FD');
            doc.setFontSize(9);
            doc.text("Kontaktdaten:", 125, 38);
            doc.setFont("helvetica", "bold");
            if(customer.telefon) doc.text(`Tel: ${customer.telefon}`, 125, 44);
            if(customer.handy) doc.text(`Mobil: ${customer.handy}`, 125, 49);
            if(customer.mail) { doc.setFontSize(8); doc.text(`Mail: ${customer.mail}`, 125, 54); }
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Geb: ${customer.gebDatum}`, 125, 61);
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(0, 122, 255);
            doc.text("Vertragsübersicht", 15, 75);
            const tableBody = customer.verträge.map(v => [ v.sparte, v.gesellschaft + '\n' + v.vsnr, v.beginn + ' - ' + v.ablauf, v.risiken || '-', v.zahlweise.toLowerCase().includes('monatlich') ? `${v.mob} € mtl.` : `${v.beitrag} € / Jahr` ]);
            doc.autoTable({ startY: 80, head: [['Sparte', 'Gesellschaft / VSNR', 'Laufzeit', 'Risiken / Objekt', 'Beitrag']], body: tableBody, theme: 'grid', headStyles: { fillColor: colorPrimary, textColor: 255, fontStyle: 'bold' }, styles: { fontSize: 8, cellPadding: 3, overflow: 'linebreak' }, columnStyles: { 0: { cellWidth: 40 }, 3: { cellWidth: 45 } } });
            if (notes && notes.length > 0) {
                let finalY = doc.lastAutoTable.finalY + 15;
                if (finalY > 250) { doc.addPage(); finalY = 20; }
                doc.setFontSize(12);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(0, 122, 255);
                doc.text("Notizen & Historie", 15, finalY);
                const noteBody = notes.map(n => [n.date, n.author, n.text]);
                doc.autoTable({ startY: finalY + 5, head: [['Datum', 'Autor', 'Notiz']], body: noteBody, theme: 'striped', styles: { fontSize: 8 }, headStyles: { fillColor: [150, 150, 150] }, columnStyles: { 0: { cellWidth: 25 }, 1: { cellWidth: 35 } } });
            }
            doc.save(`Kunde_${customer.name}_${customer.vorname}.pdf`);
        };

        // --- NEW: WORD DOC GENERATOR ---
        const generateWordDoc = (type, customer, user) => {
            const dateStr = new Date().toLocaleDateString('de-DE');
            
            let subject = 'Betreff';
            let bodyText = '';
            
            // Standard-Variablen (Vermittler schreibt an Kunde)
            let senderLine = `Signal Iduna - ${user.name} - Münchner Str. 209 - 85757 Karlsfeld`;
            let recipientHTML = `
                ${customer.vorname} ${customer.name}<br>
                ${customer.strasse}<br>
                ${customer.plz} ${customer.ort}
            `;
            let footerHTML = `
                <p>Mit freundlichen Grüßen</p>
                <br>
                <br>
                <p>${user.name}<br>Signal Iduna</p>
            `;

            if (type === 'kuendigung') {
                // SPEZIALFALL: Kunde schreibt an Vermittler/Versicherung (Kündigung)
                senderLine = `${customer.vorname} ${customer.name} - ${customer.strasse} - ${customer.plz} ${customer.ort}`;
                recipientHTML = `
                    Signal Iduna<br>
                    Bezirksdirektion ${user.name}<br>
                    Münchner Str. 209<br>
                    85757 Karlsfeld
                `;
                subject = 'Betreff: Kündigung meiner Versicherung';
                bodyText = `
                    <p>Sehr geehrte Damen und Herren,</p>
                    <p>hiermit kündige ich meine Versicherung mit der Versicherungsscheinnummer: _________________________</p>
                    <p>zum nächstmöglichen Termin / zum: _________________________.</p>
                    <p>Bitte senden Sie mir eine schriftliche Kündigungsbestätigung zu.</p>
                `;
                footerHTML = `
                    <p>Mit freundlichen Grüßen</p>
                    <br>
                    <br>
                    <p>${customer.vorname} ${customer.name}</p>
                `;
            } else {
                // Standard-Fälle (Vermittler schreibt an Kunde)
                let salutation = (customer.anrede && customer.name) 
                    ? `Sehr geehrte${customer.anrede === 'Herr' ? 'r Herr' : ' Frau'} ${customer.name},`
                    : 'Sehr geehrte Damen und Herren,';

                if (type === 'blanko') {
                    subject = 'Betreff: Ihr Anliegen';
                    bodyText = `<p>${salutation}</p><p></p><p></p>`;
                } else if (type === 'rueckruf') {
                    subject = 'Betreff: Bitte um Rückruf';
                    bodyText = `<p>${salutation}</p><p>ich habe versucht, Sie telefonisch zu erreichen. Bitte rufen Sie mich zwecks Terminvereinbarung oder Besprechung Ihrer Verträge zurück.</p><p>Vielen Dank.</p>`;
                }
            }

            const htmlContent = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset="utf-8">
                <title>Dokument</title>
                <style>
                    body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.5; }
                    .header { font-size: 8pt; text-decoration: underline; margin-bottom: 30px; color: #555; }
                    .recipient-box { margin-bottom: 60px; font-weight: bold; }
                    .date { text-align: right; margin-bottom: 30px; }
                    .subject { font-weight: bold; margin-bottom: 20px; font-size: 12pt; }
                    .footer { margin-top: 50px; }
                </style>
            </head>
            <body>
                <div class="header">${senderLine}</div>
                
                <div class="recipient-box">
                    ${recipientHTML}
                </div>

                <div class="date">Karlsfeld, den ${dateStr}</div>

                <div class="subject">${subject}</div>

                ${bodyText}

                <div class="footer">
                    ${footerHTML}
                </div>
            </body>
            </html>
            `;

            const blob = new Blob(['\ufeff', htmlContent], {
                type: 'application/msword'
            });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${type}_${customer.name}.doc`; 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const generateMockCustomers = (count) => {
            return Array.from({ length: count }, (_, i) => ({
                id: String(i + 1), anrede: 'Herr', vorname: 'Max', name: 'Mustermann', strasse: 'Musterstr. 1', plz: '12345', ort: 'Musterstadt', telefon: '', handy: '', mail: '', gebDatum: '01.01.1980', zustMA: 'Max Mustermann', adp: '1234', btnr: '00400', notizen: [], verträge: []
            }));
        };

        const IOSCard = React.memo(({ title, children, className = "", noPadding = false, onClick, headerAction }) => (
            <div onClick={onClick} className={`bg-white/80 backdrop-blur-xl border border-white/40 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-3xl overflow-hidden ${className} ${onClick ? 'cursor-pointer hover:shadow-md transition-all active:scale-[0.99]' : ''}`}>
                {title && (
                    <div className="px-6 py-4 border-b border-gray-100/50 bg-white/40 backdrop-blur-md flex justify-between items-center">
                        <h3 className="font-bold text-gray-800 text-lg tracking-tight">{title}</h3>
                        {headerAction}
                    </div>
                )}
                <div className={noPadding ? "" : "p-6"}>{children}</div>
            </div>
        ));

        const IOSBadge = React.memo(({ children, color = "blue" }) => {
            const colors = { blue: "bg-blue-100 text-blue-700", green: "bg-green-100 text-green-700", red: "bg-red-100 text-red-700", amber: "bg-amber-100 text-amber-700", gray: "bg-gray-100 text-gray-700", purple: "bg-purple-100 text-purple-700" };
            return <span className={`px-3 py-1 rounded-full text-xs font-semibold ${colors[color]}`}>{children}</span>;
        });

        const IOSButton = React.memo(({ children, onClick, variant = "primary", className = "", icon: Icon, disabled, type="button" }) => {

        const IOSInput = React.memo((props) => (

        // --- VIEWS ---
        const LoginView = ({ onLogin, loginError, isLoggingIn, loadingProgress }) => {
            const [pin, setPin] = useState('');
            const handleKeyDown = useCallback((e) => {
                if (e.key >= '0' && e.key <= '9') {
                    setPin(prev => {
                        const next = prev + e.key;
                        if (next.length === 4) setTimeout(() => onLogin(next), 0);
                        return next.length <= 4 ? next : prev;
                    });
                } else if (e.key === 'Backspace') setPin(prev => prev.slice(0, -1));
            }, [onLogin]);

            useEffect(() => {
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleKeyDown]);

            useEffect(() => { if (loginError) setPin(''); }, [loginError]);

            const handleNumClick = (num) => {
                setPin(prev => {
                    const next = prev + num;
                    if(next.length === 4) setTimeout(() => onLogin(next), 0);
                    return next.length <= 4 ? next : prev;
                });
            };
            
            if (isLoggingIn) {
                return (
                <div className="min-h-screen bg-[#F2F2F7] flex flex-col items-center justify-center p-6 animate-fade-in">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-xl flex flex-col items-center w-full max-w-sm">

            const myCustomers = useMemo(() => {
                if (!currentUser) return [];
                if (currentUser.role === 'admin') return customers;
                const allowedUserIds = [currentUser.id];
                if (currentUser.allowedToView) allowedUserIds.push(...currentUser.allowedToView);
                const allowedUserObjects = allUsers.filter(u => allowedUserIds.includes(u.id));
                return customers.filter(c => checkAnyMatch(allowedUserObjects, c));
            }, [customers, currentUser, allUsers]);

            const upcomingBirthdays = useMemo(() => myCustomers.filter(c => isBirthdayUpcoming(c.gebDatum)).sort((a, b) => getNextBirthdayDate(a.gebDatum) - getNextBirthdayDate(b.gebDatum)), [myCustomers]);
            
            const expiringContractsCount = useMemo(() => {

                myCustomers.forEach(c => {

                        const safeId = (v.vsnr || '').replace(/\//g, '_');
                        if (contractStates[safeId] !== 'done') {
                            const isLifeOrCar = (v.sparte || '').toLowerCase().match(/leben|kfz/);
                            if (!isLifeOrCar && isExpiringSoon(v.ablauf)) count++;
                        }

            const totalContracts = useMemo(() => myCustomers.reduce((sum, c) => sum + (c.verträge ? c.verträge.length : 0), 0), [myCustomers]);
            const contractDensity = useMemo(() => { if (myCustomers.length === 0) return "0.00"; return (totalContracts / myCustomers.length).toFixed(2); }, [totalContracts, myCustomers]);

        const ActivityLogView = React.memo(({ logs }) => (

        // --- NEW: Roster & Shift Components (Moved outside AppContent to avoid syntax errors) ---

        const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();

        // 1. CALCULATE BAVARIAN HOLIDAYS
        const getBavarianHolidays = (year) => {
            const holidays = {};
            // Fixed Holidays
            const fixed = {
                '01-01': 'Neujahr',
                '01-06': 'Heilige Drei Könige',
                '05-01': 'Tag der Arbeit',
                '08-15': 'Mariä Himmelfahrt',
                '10-03': 'Tag der Deutschen Einheit',
                '11-01': 'Allerheiligen',
                '12-25': '1. Weihnachtstag',
                '12-26': '2. Weihnachtstag'
            };
            Object.keys(fixed).forEach(k => holidays[`${year}-${k}`] = fixed[k]);

            // Variable Holidays (Easter dependent)
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const n = Math.floor((h + l - 7 * m + 114) / 31);
            const p = (h + l - 7 * m + 114) % 31;
            
            const easterDate = new Date(year, n - 1, p + 1);
            
            const addDays = (date, days) => {
                const result = new Date(date);
                result.setDate(result.getDate() + days);
                return result.toISOString().split('T')[0];
            };

            holidays[addDays(easterDate, -2)] = 'Karfreitag';
            holidays[addDays(easterDate, 1)] = 'Ostermontag';
            holidays[addDays(easterDate, 39)] = 'Christi Himmelfahrt';
            holidays[addDays(easterDate, 50)] = 'Pfingstmontag';
            holidays[addDays(easterDate, 60)] = 'Fronleichnam';

            return holidays;
        };

        // Hilfsfunktion zur Stundenberechnung
        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            try {
                const [h1, m1] = start.split(':').map(Number);
                const [h2, m2] = end.split(':').map(Number);
                const diff = (h2 + m2/60) - (h1 + m1/60);
                return diff > 0 ? diff : 0;
            } catch (e) { return 0; }
        };

        const ShiftModal = ({ isOpen, onClose, onSave, onDelete, initialData, selectedDate, selectedUser }) => {
            if (!isOpen) return null;
            
            const handlePreset = (e, type) => {
                e.preventDefault(); // Wichtig: Verhindert Standard-Verhalten
                e.stopPropagation(); // Wichtig: Verhindert Klick-Durchschlag
                
                let start = '';
                let end = '';
                
                if (type === 'früh') { start = '09:00'; end = '13:00'; }
                else if (type === 'spät') { start = '13:00'; end = '18:00'; }
                
                onSave({ 
                    type: type, 
                    start: start, 
                    end: end 
                });
            };

            const handleCustomSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                onSave({
                    type: 'custom',
                    start: fd.get('start'),
                    end: fd.get('end'),
                });
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl scale-100" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h3 className="text-lg font-bold">Schicht bearbeiten</h3>
                                <p className="text-xs text-gray-500">{selectedUser?.name} • {selectedDate}</p>
                            </div>
                            <button onClick={onClose} className="p-2 bg-gray-100 rounded-full"><X size={16}/></button>
                        </div>
                        
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={(e) => handlePreset(e, 'früh')} className="bg-blue-50 text-blue-700 hover:bg-blue-100 py-3 rounded-xl font-bold text-sm transition-all flex flex-col items-center border border-blue-100 active:scale-95">
                                    <span>Früh</span>
                                    <span className="text-[10px] font-normal opacity-70">09:00 - 13:00</span>
                                </button>
                                <button type="button" onClick={(e) => handlePreset(e, 'spät')} className="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 py-3 rounded-xl font-bold text-sm transition-all flex flex-col items-center border border-indigo-100 active:scale-95">
                                    <span>Spät</span>
                                    <span className="text-[10px] font-normal opacity-70">13:00 - 18:00</span>
                                </button>
                                <button type="button" onClick={(e) => handlePreset(e, 'urlaub')} className="bg-green-100 text-green-700 hover:bg-green-200 py-3 rounded-xl font-bold text-sm transition-all border border-green-200 active:scale-95">Urlaub</button>
                                <button type="button" onClick={(e) => handlePreset(e, 'krank')} className="bg-red-100 text-red-700 hover:bg-red-200 py-3 rounded-xl font-bold text-sm transition-all border border-red-200 active:scale-95">Krank</button>
                            </div>
                            
                            <form onSubmit={handleCustomSubmit} className="relative border-t border-gray-100 pt-4 mt-2">
                                <p className="text-xs text-gray-400 font-bold uppercase mb-2">Benutzerdefiniert</p>
                                <div className="flex items-center gap-2">
                                    <input name="start" type="time" defaultValue={initialData?.start} className="bg-gray-50 rounded-xl px-3 py-2 text-sm border border-gray-200 w-full"/>
                                    <span>-</span>
                                    <input name="end" type="time" defaultValue={initialData?.end} className="bg-gray-50 rounded-xl px-3 py-2 text-sm border border-gray-200 w-full"/>
                                </div>
                                <button type="submit" className="mt-2 w-full py-2 bg-gray-800 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-gray-700 active:scale-95">Zeit speichern</button>
                            </form>

                            {initialData && (
                                <button type="button" onClick={onDelete} className="w-full py-2 text-red-500 text-sm font-bold flex items-center justify-center gap-2 hover:bg-red-50 rounded-xl active:scale-95">
                                    <Trash2 size={16}/> Schicht löschen
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const RosterStats = ({ users, shifts, currentYear, currentMonth }) => {
            const stats = useMemo(() => {
                return users.map(user => {
                    const userShifts = shifts.filter(s => s.userId === user.id);
                    const monthHours = userShifts.reduce((sum, s) => {
                        const d = new Date(s.date);
                        if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
                            return sum + calculateDuration(s.start, s.end);
                        }
                        return sum;
                    }, 0);
                    const yearHours = userShifts.reduce((sum, s) => {
                        const d = new Date(s.date);
                        if (d.getFullYear() === currentYear) {
                            return sum + calculateDuration(s.start, s.end);
                        }
                        return sum;
                    }, 0);
                    return { ...user, monthHours, yearHours };
                }).sort((a,b) => b.monthHours - a.monthHours);
            }, [users, shifts, currentYear, currentMonth]);

            return (
                <div className="mt-8 bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden p-6">
                    <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                        <Activity size={20} className="text-blue-500"/>
                        Auswertung & Stunden
                    </h3>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 text-gray-500 font-bold uppercase text-xs">
                                <tr>
                                    <th className="p-3 rounded-l-xl">Mitarbeiter</th>
                                    <th className="p-3 text-right">Stunden (Monat)</th>
                                    <th className="p-3 text-right rounded-r-xl">Stunden (Jahr)</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {stats.map(s => (
                                    <tr key={s.id} className="hover:bg-gray-50">
                                        <td className="p-3 font-medium">{s.name}</td>
                                        <td className="p-3 text-right font-mono font-bold text-blue-600">{s.monthHours.toFixed(1)} h</td>
                                        <td className="p-3 text-right font-mono text-gray-600">{s.yearHours.toFixed(1)} h</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const RosterView = React.memo(({ users, shifts, closings, currentUser, onSaveShift, onDeleteShift, onToggleClosing }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedShift, setSelectedShift] = useState(null); 

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const holidays = useMemo(() => getBavarianHolidays(year), [year]);

            // NEU: Helper um zu prüfen, ob der aktuelle User bearbeiten darf
            const canEdit = currentUser.role === 'admin' || currentUser.canEditRoster;

            const getShift = (userId, day) => {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                return shifts.find(s => s.userId === userId && s.date === dateStr);
            };

            const handleCellClick = (userId, day) => {
                if (!canEdit) return; // Nur erlaubt wenn Admin oder Berechtigung
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const shift = getShift(userId, day);
                const user = users.find(u => u.id === userId);
                setSelectedShift({ userId, dateStr, shift, user, dayDisplay: `${day}.${month+1}.${year}` });
            };

            const renderCellContent = (shift) => {
                if (!shift) return null;
                if (shift.type === 'urlaub') return <div className="w-full h-full bg-green-100 text-green-700 flex items-center justify-center text-[10px] font-bold rounded border border-green-200">U</div>;
                if (shift.type === 'krank') return <div className="w-full h-full bg-red-100 text-red-700 flex items-center justify-center text-[10px] font-bold rounded border border-red-200">K</div>;

                    <div className="w-full h-full bg-blue-50 text-blue-700 flex flex-col items-center justify-center rounded overflow-hidden border border-blue-100">
                        <span className="text-[10px] font-bold">F</span>
                        <span className="text-[7px] leading-none">09-13</span>
                    </div>
                );
                if (shift.type === 'spät') return (
                    <div className="w-full h-full bg-indigo-50 text-indigo-700 flex flex-col items-center justify-center rounded overflow-hidden border border-indigo-100">
                        <span className="text-[10px] font-bold">S</span>
                        <span className="text-[7px] leading-none">13-18</span>
                    </div>
                );
                
                return <div className="w-full h-full bg-gray-100 text-gray-700 flex flex-col items-center justify-center text-[9px] leading-tight rounded border border-gray-200"><span>{shift.start}</span><span>{shift.end}</span></div>;
            };

            const sortedUsers = useMemo(() => [...users].filter(u => !u.hidden).sort((a,b) => a.name.localeCompare(b.name)), [users]);

            return (
                <div className="animate-fade-in flex flex-col h-full pb-10">

                        <div className="flex items-center gap-4 bg-white rounded-xl p-1 shadow-sm border border-gray-100">
                            <button onClick={() => setCurrentDate(new Date(year, month - 1))} className="p-2 hover:bg-gray-100 rounded-lg"><ChevronLeft size={20}/></button>

                            <button onClick={() => setCurrentDate(new Date(year, month + 1))} className="p-2 hover:bg-gray-100 rounded-lg"><ChevronRight size={20}/></button>
                        </div>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden flex flex-col relative">
                        <div className="overflow-auto max-h-[60vh]">
                            <table className="w-full border-collapse" style={{ minWidth: `${daysInMonth * 40 + 150}px` }}>
                                <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                    <tr>
                                        <th className="p-3 text-left text-xs font-bold text-gray-500 uppercase sticky left-0 bg-gray-50 z-20 border-b border-r border-gray-200 min-w-[150px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Mitarbeiter</th>
                                        {days.map(d => {
                                            const date = new Date(year, month, d);
                                            const dateStr = date.toISOString().split('T')[0];
                                            const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                                            const isHoliday = holidays[dateStr];
                                            const isClosed = closings.includes(dateStr);
                                            
                                            // Handle Header Click for Office Closed
                                            const handleHeaderClick = () => {
                                                if (canEdit) onToggleClosing(dateStr);
                                            };

                                            return (
                                                <th 
                                                    key={d} 
                                                    onClick={handleHeaderClick}
                                                    className={`p-2 text-center text-xs font-bold border-b border-gray-100 min-w-[40px] relative group 
                                                        ${isHoliday ? 'bg-red-50 text-red-600' : isWeekend ? 'bg-gray-100 text-gray-600' : 'text-gray-400'}
                                                        ${canEdit ? 'cursor-pointer hover:bg-gray-200' : ''}
                                                    `}
                                                    title={isHoliday || (isClosed ? "Büro geschlossen" : "")}
                                                >
                                                    <div className="flex flex-col items-center">
                                                        <span>{d}</span>
                                                        <span className="text-[9px] font-normal">{['So','Mo','Di','Mi','Do','Fr','Sa'][date.getDay()]}</span>
                                                        {isHoliday && <span className="absolute top-0 right-0 w-1.5 h-1.5 bg-red-500 rounded-full"></span>}
                                                        {isClosed && <CalendarX size={12} className="text-gray-400 mt-1"/>}
                                                    </div>
                                                </th>
                                            );
                                        })}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {sortedUsers.map(u => (
                                        <tr key={u.id} className={`${u.id === currentUser.id ? 'bg-blue-50/30' : 'bg-white'} hover:bg-gray-50`}>
                                            <td className={`p-3 text-sm font-medium text-gray-900 sticky left-0 z-10 border-r border-gray-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] ${u.id === currentUser.id ? 'bg-blue-50' : 'bg-white'}`}>{u.name}</td>
                                            {days.map(d => {
                                                const shift = getShift(u.id, d);
                                                const date = new Date(year, month, d);
                                                const dateStr = date.toISOString().split('T')[0];
                                                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                                                const isHoliday = holidays[dateStr];
                                                const isClosed = closings.includes(dateStr);

                                                return (
                                                    <td 
                                                        key={d} 
                                                        onClick={() => !isClosed && handleCellClick(u.id, d)}
                                                        className={`p-1 border-r border-gray-50 h-12 relative transition-colors 
                                                            ${isClosed ? 'bg-gray-100 pattern-diagonal-stripes cursor-not-allowed' : 
                                                              isHoliday ? 'bg-red-50/30' : 
                                                              isWeekend ? 'bg-gray-50/50' : ''} 
                                                            ${!isClosed && canEdit ? 'cursor-pointer hover:bg-blue-50' : ''}
                                                        `}
                                                    >
                                                        {isClosed ? null : renderCellContent(shift)}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Statistik nur für Admins und Planer anzeigen */}
                    {canEdit && (
                        <RosterStats users={sortedUsers} shifts={shifts} currentYear={year} currentMonth={month} />
                    )}

                    <ShiftModal 
                        isOpen={!!selectedShift}
                        onClose={() => setSelectedShift(null)}
                        selectedDate={selectedShift?.dayDisplay}
                        selectedUser={selectedShift?.user}

            const processCSVData = async (data) => {
                const grouped = {};
                const potentialUsers = new Map();

                const vorname = getColumnValue(row, ['Vorname']) || '';
                const name = getColumnValue(row, ['Name', 'Nachname']) || '';
                const rawGeb = getColumnValue(row, ['Geb. Datum', 'Geburtsdatum', 'GebDatum']) || '';
                const gebDatum = formatDateToGerman(rawGeb);
                
                const adpColValue = getColumnValue(row, ['ADP', 'AD-Nummer', 'Vermittler-Nr', 'Vermittlernummer', 'VP-Nr', 'VP', 'Agentur', 'Kennziffer']) || '';
                const explicitNameValue = getColumnValue(row, ['Zuständiger Mitarbeiter', 'Zuständiger', 'Betreuer', 'Vermittler']) || '';
                
                const btnr = getColumnValue(row, ['BTNR', 'Betriebsnummer']) || '';
                const panr = getColumnValue(row, ['PANR', 'Partnernummer']) || '';
                
                let finalAgentName = 'Unzugewiesen';
                let finalAgentAdv = '';

                if (adpColValue) {
                    const isNumeric = /^\d+$/.test(adpColValue.replace(/\s/g, ''));
                    if (isNumeric) {
                        finalAgentAdv = adpColValue;
                        if (explicitNameValue && isNaN(explicitNameValue.replace(/\s/g, ''))) {
                            finalAgentName = normalizeName(explicitNameValue);
                        } else {
                            finalAgentName = `Vermittler ${adpColValue}`;
                        }
                    } else {
                        finalAgentName = normalizeName(adpColValue);
                    }
                } else if (explicitNameValue) {
                    finalAgentName = normalizeName(explicitNameValue);
                }

                if (finalAgentName !== 'Unzugewiesen') {
                    const key = finalAgentAdv || finalAgentName;
                    if (!potentialUsers.has(key)) {
                            potentialUsers.set(key, { name: finalAgentName, adv: finalAgentAdv, btnr: btnr });
                    }
                }

                const stableId = generateStableId(vorname, name, gebDatum);
                const key = stableId || `row-${idx}`;

                const contract = {
                    sparte: getColumnValue(row, ['Sparte', 'Produkt']),
                    gesellschaft: getColumnValue(row, ['Gesellschaft', 'Versicherer', 'VU']),
                    vsnr: getColumnValue(row, ['VSNR', 'Versicherungsscheinnummer']),
                    status: getColumnValue(row, ['Status']) || 'Aktiv',

                };

                if (grouped[key]) grouped[key].verträge.push(contract);

                    id: key, 
                    anrede: getColumnValue(row, ['Anrede']), 
                    vorname, name, 
                    strasse: getColumnValue(row, ['Straße', 'Strasse']), 
                    plz: getColumnValue(row, ['PLZ']), 
                    ort: getColumnValue(row, ['Ort']), 
                    telefon: getColumnValue(row, ['Telefon']), 
                    handy: getColumnValue(row, ['Handy']), 
                    mail: getColumnValue(row, ['Mail']), 
                    gebDatum, 
                    zustMA: finalAgentName, 
                    adp: finalAgentAdv || finalAgentName, 
                    btnr, 
                    panr,
                    notizen: [], 
                    verträge: [contract] 
                };

                        const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', newUserId); 
                        const snap = await getDoc(userRef); 
                        if (snap.exists()) { } 
                        if(!payload.code) payload.code = Math.floor(1000 + Math.random() * 9000).toString();

                    }
                    setShowUserModal(false);
                } catch (err) { console.error("Fehler beim Speichern:", err); showToast("Fehler beim Speichern: " + err.message, 'error'); }
            };

            const editUser = async (u) => { 
                setUserFormData(u); 
                setEditingUserAllowedToView(u.allowedToView || []); 
                setShowUserModal(true); 
            };
            
            const cleanupDuplicates = async () => { 
                if (!firebaseUser || !db) return; 
                const batch = writeBatch(db); 
                const seenNames = new Set(); 
                let count = 0; 
                [...users].sort((a, b) => (a.id.includes('_') ? -1 : 1)).forEach(u => { 
                    const norm = normalizeName(u.name).toLowerCase(); 
                    if (seenNames.has(norm)) { batch.delete(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', u.id)); count++; } 
                    else seenNames.add(norm); 
                }); 
                if (count > 0) { await batch.commit(); showToast(`${count} Duplikate gelöscht.`); } else showToast("Liste ist sauber."); 
            };

            const deleteUser = async (uid) => { if(firebaseUser && db) await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', uid)); };
            const toggleUserVisibility = async (u) => { if (firebaseUser && db) await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', u.id), { hidden: !u.hidden }); };
            const openPermissionsModal = (user) => { setPermissionsTargetUser(user); setShowPermissionsModal(true); };
            
            const togglePermission = async (targetId) => { 
                if(!permissionsTargetUser || !firebaseUser || !db) return; 
                const currentAllowed = permissionsTargetUser.allowedToView || []; 
                let newAllowed; 
                if (currentAllowed.includes(targetId)) newAllowed = currentAllowed.filter(id => id !== targetId); 
                else newAllowed = [...currentAllowed, targetId]; 
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', permissionsTargetUser.id), { allowedToView: newAllowed }); 
                setPermissionsTargetUser({...permissionsTargetUser, allowedToView: newAllowed}); 
            };

            const fetchGoogleData = async (inputUrl, isAutoLoad = false) => { 
                if (!inputUrl) return; 
                setIsImporting(true); 
                setImportError(null); 
                setLoadingProgress(10); 
                
                let targetUrl = inputUrl; 
                if (inputUrl.includes('docs.google.com')) {
                    const idMatch = inputUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    const isExport = inputUrl.includes('output=csv') || inputUrl.includes('format=csv') || inputUrl.includes('/pub?');
                    if (idMatch && idMatch[1] && !isExport && !inputUrl.includes('/pub')) {
                        targetUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
                    }
                }
                
                const cacheBuster = (targetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
                const finalTargetUrl = targetUrl + cacheBuster;

                // UPDATE: Erweiterte Proxy-Liste für maximale Kompatibilität
                const strategies = [
                    // 1. Direkt (beste Option für Pub-Links)
                    { name: "Direkt", url: finalTargetUrl },
                    // 2. CorsProxy.io (Standard)
                    { name: "ProxyIO", url: `https://corsproxy.io/?${encodeURIComponent(finalTargetUrl)}` },
                    // 3. CodeTabs (Sehr starker Proxy)
                    { name: "CodeTabs", url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(finalTargetUrl)}` },
                    // 4. AllOrigins (Fallback)
                    { name: "AllOrigins", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(finalTargetUrl)}` },
                    // 5. ThingProxy (Letzte Reserve)
                    { name: "ThingProxy", url: `https://thingproxy.freeboard.io/fetch/${finalTargetUrl}` }
                ];

                let csvContent = null;
                let fetchSuccess = false;

                for (const strat of strategies) {
                    try {
                        console.log(`Versuche Download via ${strat.name}...`);
                        setLoadingProgress(prev => Math.min(prev + 10, 80)); 
                        
                        const res = await fetch(strat.url);
                        if (!res.ok) {
                            console.warn(`${strat.name} Fehler ${res.status}: ${res.statusText}`);
                            continue; 
                        }
                        
                        const txt = await res.text();

                        if (txt.includes('<!DOCTYPE') || txt.includes('<html') || txt.includes('google.com/accounts')) {
                            console.warn(`${strat.name} lieferte HTML (Auth?)`);
                            continue; 
                        }
                        
                        if (!txt || txt.length < 10) {
                            console.warn(`${strat.name} lieferte leere Daten`);
                            continue;
                        }

                        csvContent = txt;
                        fetchSuccess = true;
                        setLoadingProgress(80); 
                        console.log(`Erfolg mit ${strat.name}`);
                        break; 
                    } catch (e) {
                        console.warn(`${strat.name} fehlgeschlagen:`, e);
                    }
                }

                if (!fetchSuccess || !csvContent) {
                    const errorMsg = "Import fehlgeschlagen. Google blockiert den Zugriff. Bitte prüfen Sie, ob das Sheet 'Im Web veröffentlicht' ist.";
                    console.error(errorMsg);
                    setImportError(errorMsg);
                    setIsImporting(false);
                    if (isAutoLoad) setIsDataReady(true);
                    setLoadingProgress(0);
                    return;
                }
                
                setLoadingProgress(85);

                if(!window.Papa) await new Promise(r => { 
                    const s = document.createElement('script'); 
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js'; 
                    s.onload=r; 
                    document.body.appendChild(s); 
                }); 
                
                try { 
                    window.Papa.parse(csvContent, { 
                        header: true, 
                        skipEmptyLines: 'greedy', 
                        complete: async (res) => { 
                            setLoadingProgress(95); 
                            if(res.errors.length > 0 && res.data.length === 0) {
                                setImportError("CSV Parsing Fehler: Datei scheint beschädigt."); 
                            } else {
                                const count = await processCSVData(res.data); 
                                if (count === 0) setImportError("Keine passenden Daten gefunden (Spaltennamen prüfen).");
                                else if (!isAutoLoad) showToast(`${count} Datensätze aktualisiert.`); 
                            }
                            setLoadingProgress(100);
                            setIsImporting(false); 
                            if(isAutoLoad) setIsDataReady(true); 
                        } 
                    }); 
                } catch(e) { 
                    setImportError("Verarbeitungsfehler: " + e.message);
                    setIsImporting(false); 
                } 
            };

            const toggleContractStatus = async (contractId, currentStatus) => { 
                if (firebaseUser && db) { 
                    const newStatus = currentStatus === 'done' ? 'open' : 'done'; 
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'contract_states', contractId), { 
                        status: newStatus, 
                        updatedAt: new Date().toISOString(), 
                        updatedBy: currentUser.name 
                    }, { merge: true }); 
                } 
            };
            
            const toggleExpAssignee = (name) => setExpAssigneeFilter(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);

            const deleteCustomer = useCallback((customerId) => {
                setRawCustomers(prev => prev.filter(c => c.id !== customerId));
            }, []);

            useEffect(() => {
                if(!db || !firebaseUser) return;
                const unsubTasks = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'tasks'), (s) => setTasks(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubPw = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'passwords'), (s) => setPasswords(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubUsers = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), (s) => { 
                    const list = s.docs.map(d => ({id: d.id, ...d.data()})); 
                    if(list.length) setUsers(list); 
                    else setUsers([{ id: '1', name: 'Admin', code: '2606', role: 'admin', adv: '-' }]); 
                });
                const unsubNotes = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'customer_notes'), (s) => { const map = {}; s.docs.forEach(d => map[d.id] = d.data().notes); setNotesMap(map); });
                const unsubContractStates = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'contract_states'), (s) => { const map = {}; s.docs.forEach(d => map[d.id] = d.data().status); setContractStates(map); });
                const unsubLogs = onSnapshot(query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'logs'), orderBy('timestamp', 'desc'), limit(100)), (s) => setLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                // NEW: Listen for shifts and closings
                const unsubShifts = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'roster_shifts'), (s) => setShifts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubClosings = onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'roster_closings', 'list'), (s) => {
                    if (s.exists()) setClosings(s.data().dates || []);
                    else setClosings([]);
                });
                
                return () => { unsubTasks(); unsubPw(); unsubUsers(); unsubNotes(); unsubLogs(); unsubContractStates(); unsubShifts(); unsubClosings(); };

                        </div>
                        
                        <div className="mt-auto mb-8 bg-white p-4 rounded-[2rem] shadow-lg border border-gray-100 flex items-center gap-4 animate-scale-in">
                             <div className="w-12 h-12 rounded-full bg-blue-50 text-[#007AFF] flex items-center justify-center font-bold text-xl">{currentUser.name[0]}</div>

                                 <p className="font-bold text-gray-900">{currentUser.name}</p>

                <aside className="w-[280px] bg-white/80 backdrop-blur-2xl border-r border-gray-200 hidden md:flex flex-col z-20">
                    <div className="p-8 pb-4">

                </aside>
                <main className="flex-1 flex flex-col relative overflow-hidden">
                    {/* MOBILE HEADER - UPDATED */}
                    <div className="md:hidden bg-white/80 backdrop-blur-xl border-b p-4 flex justify-between items-center z-30 sticky top-0 shadow-sm">

                    <div className="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10 scroll-smooth">
                        <div className="max-w-7xl mx-auto">
                        {currentView === 'dashboard' && <DashboardView {...{ customers: rawCustomers, notesMap, tasks, shifts, currentUser, rosterUrl, onSelectCustomer: setSelectedCustomer, onUpdateTask: updateTask, onDeleteTask: deleteTask, onShowTaskModal: setShowTaskModal, onOpenBirthdays: () => setShowBirthdayModal(true), onOpenExpirations: () => setShowExpirationModal(true), allUsers: users, contractStates, onToggleContractState: toggleContractStatus, onOpenTasks: () => setShowTasksListModal(true) }} />}
