        function useDebounce(value, delay) { const [debouncedValue, setDebouncedValue] = useState(value); useEffect(() => { const h = setTimeout(() => setDebouncedValue(value), delay); return () => clearTimeout(h); }, [value, delay]); return debouncedValue; }
        const copyToClipboard = (text, showToastFn) => { if (!text) return; const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy') ? showToastFn("Kopiert!") : showToastFn("Fehler", "error"); } catch (e) { showToastFn("Fehler", "error"); } document.body.removeChild(ta); };
        const parseAnyDate = (s) => { if (!s) return null; if (s.includes('-')) { const [y, m, d] = s.split('-'); return new Date(y, m - 1, d); } if (s.includes('.')) { const [d, m, y] = s.split('.'); return new Date(y, m - 1, d); } return null; };
        const formatDateToGerman = (d) => { if (!d) return ''; const date = typeof d === 'string' ? parseAnyDate(d) : d; if (!date || isNaN(date.getTime())) return d; return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`; };
        const formatDateTime = (s) => { try { return new Date(s).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) { return '-'; } };
        const normalizeName = (n) => n ? n.replace(/[:.;,]/g, ' ').replace(/\s+/g, ' ').trim() : '';
        const getFirstName = (n) => n ? (n.includes(',') ? n.split(',')[1].trim().split(' ')[0] : n.split(' ')[0]) : '';
        const normalizeNumber = (v) => v ? String(v).replace(/[^0-9]/g, '').replace(/^0+/, '') : '';
        const generateUserId = (n) => { const map = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' }; return normalizeName(n).toLowerCase().replace(/[äöüß]/g, m => map[m]).replace(/[^a-z0-9]/g, '_') || 'user_' + Math.floor(Math.random() * 10000); };
        const generateStableId = (v, n, g) => `${v}|${n}|${g}`.toLowerCase().replace(/[^a-z0-9]/g, '') || 'unknown-' + Math.random();
        
        const checkMatch = (allowed, c) => {
            if (!allowed || !Array.isArray(allowed)) return false;
            if (allowed.some(u => u.role === 'admin')) return true;
            return allowed.some(u => {
                if (!u) return false;
                const uAdv = normalizeNumber(u.adv), cAdp = normalizeNumber(c.adp), cBtnr = normalizeNumber(c.btnr), uBtnr = normalizeNumber(u.btnr);
                if (uAdv.length > 2 && ((cAdp && uAdv.includes(cAdp)) || (cBtnr && uAdv.includes(cBtnr)))) return true;
                if (uBtnr.length > 2 && ((cAdp && uBtnr.includes(cAdp)) || (cBtnr && uBtnr.includes(cBtnr)))) return true;
                const uName = normalizeName(u.name).toLowerCase(), cAdpName = normalizeName(c.adp).toLowerCase();
                return uName.length > 2 && cAdpName.includes(uName);
            });
        };
        const isBirthdayUpcoming = (d) => { const dob = parseAnyDate(d); if (!dob) return false; const today = new Date(), next = new Date(today.getFullYear(), dob.getMonth(), dob.getDate()); if (next < today) next.setFullYear(today.getFullYear() + 1); const diff = Math.ceil((next - today) / (86400000)); return diff >= 0 && diff <= 30; };
        const getNextBirthdayDate = (d) => { const dob = parseAnyDate(d); if (!dob) return new Date(9999, 11, 31); const today = new Date(), next = new Date(today.getFullYear(), dob.getMonth(), dob.getDate()); if (next < today) next.setFullYear(today.getFullYear() + 1); return next; };
        const isExpiringSoon = (d) => { const expiry = parseAnyDate(d); if (!expiry) return false; const diff = Math.ceil((expiry - new Date()) / (86400000)); return diff > 0 && diff <= 90; };
        const getColumnValue = (row, terms) => { const keys = Object.keys(row); for (const t of terms) if (row[t]) return row[t]; for (const t of terms) { const k = keys.find(k => k.toLowerCase().trim() === t.toLowerCase()); if (k && row[k]) return row[k]; } return ''; };
        const analyzeGaps = (contracts) => { if (!contracts) return []; const types = contracts.map(c => (c.sparte || '').toLowerCase()); const gaps = []; if (!types.some(t => t.includes('haftpflicht') || t.includes('phv'))) gaps.push('Privathaftpflicht'); if (!types.some(t => t.includes('hausrat') || t.includes('vhr'))) gaps.push('Hausrat'); if (!types.some(t => t.includes('wohngebäude') || t.includes('gebäude'))) gaps.push('Wohngebäude'); if (!types.some(t => t.includes('kfz') || t.includes('auto'))) gaps.push('KFZ'); if (!types.some(t => t.includes('rechts') || t.includes('rs'))) gaps.push('Rechtsschutz'); if (!types.some(t => t.includes('unfall'))) gaps.push('Unfall'); return gaps; };
        const generateMockCustomers = (count) => Array.from({ length: count }, (_, i) => ({ id: String(i + 1), anrede: 'Herr', vorname: 'Max', name: 'Mustermann', strasse: 'Musterstr. 1', plz: '12345', ort: 'Musterstadt', telefon: '', handy: '', mail: '', gebDatum: '01.01.1980', zustMA: 'Max Mustermann', adp: '1234', btnr: '00400', notizen: [], verträge: [] }));

        // Document Generation
        const generateWordDoc = (type, c, u) => {
            const dateStr = new Date().toLocaleDateString('de-DE');
            let s = 'Betreff', b = '', sl = `Signal Iduna - ${u.name} - Münchner Str. 209 - 85757 Karlsfeld`, r = `${c.vorname} ${c.name}<br>${c.strasse}<br>${c.plz} ${c.ort}`, f = `<p>Mit freundlichen Grüßen</p><br><br><p>${u.name}<br>Signal Iduna</p>`;
            if (type === 'kuendigung') { sl = `${c.vorname} ${c.name} - ${c.strasse} - ${c.plz} ${c.ort}`; r = `Signal Iduna<br>Bezirksdirektion ${u.name}<br>Münchner Str. 209<br>85757 Karlsfeld`; s = 'Betreff: Kündigung meiner Versicherung'; b = `<p>Sehr geehrte Damen und Herren,</p><p>hiermit kündige ich meine Versicherung mit der Versicherungsscheinnummer: _________________________</p><p>zum nächstmöglichen Termin / zum: _________________________.</p><p>Bitte senden Sie mir eine schriftliche Kündigungsbestätigung zu.</p>`; f = `<p>Mit freundlichen Grüßen</p><br><br><p>${c.vorname} ${c.name}</p>`; } 
            else if (type === 'blanko') { s = 'Betreff: Ihr Anliegen'; b = `<p>Sehr geehrte(r) ${c.name},</p><p></p><p></p>`; } 
            else if (type === 'rueckruf') { s = 'Betreff: Bitte um Rückruf'; b = `<p>Sehr geehrte(r) ${c.name},</p><p>ich habe versucht, Sie telefonisch zu erreichen. Bitte rufen Sie mich zwecks Terminvereinbarung oder Besprechung Ihrer Verträge zurück.</p><p>Vielen Dank.</p>`; }
            const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset="utf-8"><title>Doc</title><style>body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.5}.header{font-size:8pt;text-decoration:underline;margin-bottom:30px;color:#555}.recipient-box{margin-bottom:60px;font-weight:bold}.date{text-align:right;margin-bottom:30px}.subject{font-weight:bold;margin-bottom:20px;font-size:12pt}.footer{margin-top:50px}</style></head><body><div class="header">${sl}</div><div class="recipient-box">${r}</div><div class="date">Karlsfeld, den ${dateStr}</div><div class="subject">${s}</div>${b}<div class="footer">${f}</div></body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${type}_${c.name}.doc`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
        const generatePDF = async (c, n = []) => {
            if (!window.jspdf) await new Promise(r => { const s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload = r; document.body.appendChild(s); });
            if (!window.jspdf.jsPDF.prototype.autoTable) await new Promise(r => { const s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"; s.onload = r; document.body.appendChild(s); });
            const { jsPDF } = window.jspdf; const doc = new jsPDF();

            doc.setTextColor(60, 60, 60); doc.setFontSize(14); doc.text(`${c.anrede} ${c.vorname} ${c.name}`, 15, 35); doc.setFontSize(10); doc.text(`${c.strasse}\n${c.plz} ${c.ort}`, 15, 42);
            doc.autoTable({ startY: 80, head: [['Sparte', 'Gesellschaft / VSNR', 'Laufzeit', 'Risiken', 'Beitrag']], body: c.verträge.map(v => [ v.sparte, v.gesellschaft + '\n' + v.vsnr, v.beginn + ' - ' + v.ablauf, v.risiken || '-', v.beitrag + ' €' ]), theme: 'grid' });
            doc.save(`Kunde_${c.name}.pdf`);
        };

        // --- COMPONENTS ---
        const Toast = ({ message, type, onClose }) => { useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]); return (<div className={`fixed top-4 right-4 z-[100] flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg animate-fade-in ${type === 'error' ? 'bg-red-50 text-red-900 border-red-200' : 'bg-green-50 text-green-900 border-green-200'}`}>{type === 'error' ? <AlertCircle size={20} className="text-red-500"/> : <CheckCircle size={20} className="text-green-500"/>} <span className="font-medium text-sm">{message}</span> <button onClick={onClose}><X size={16} className="opacity-50 hover:opacity-100"/></button></div>); };
        const ConfirmDialog = ({ message, onConfirm, onCancel }) => (<div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in"><div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl scale-100"><div className="flex flex-col items-center text-center mb-6"><div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-4"><AlertTriangle size={24} /></div><h3 className="text-lg font-bold text-gray-900">Bestätigung</h3><p className="text-sm text-gray-500 mt-2">{message}</p></div><div className="flex gap-3"><button onClick={onCancel} className="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition-colors">Abbrechen</button><button onClick={onConfirm} className="flex-1 px-4 py-2.5 bg-gray-900 hover:bg-gray-800 text-white font-bold rounded-xl text-sm transition-colors">Bestätigen</button></div></div></div>);

        // --- SUB-VIEWS ---
        const LoginView = ({ onLogin, loginError, isLoggingIn, loadingProgress }) => {
            const [pin, setPin] = useState('');
            const handleNumClick = (num) => setPin(prev => { const next = prev + num; if(next.length === 4) setTimeout(() => onLogin(next), 0); return next.length <= 4 ? next : prev; });
            
            // KEYBOARD SUPPORT
            useEffect(() => {
                const handleKeyDown = (e) => {

            const savePassword = async (data) => { if (!firebaseUser || !db) return; if (data.id) { const { id, ...rest } = data; await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'passwords', id), rest); } else { await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'passwords'), data); } setShowPwdModal(false); };
            const delPwd = async (id) => { if(firebaseUser && db) deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'passwords', id)); };
            const processPwdCSV = (file) => { if (!file) return; const reader = new FileReader(); reader.onload = (evt) => { window.Papa.parse(evt.target.result, { header: true, skipEmptyLines: 'greedy', complete: async (results) => { if (!firebaseUser || !db) return; const batch = writeBatch(db); results.data.forEach(row => { const name = row['Name'] || row['Portal'] || row['Titel']; if (name) { const docRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'passwords')); batch.set(docRef, { name: name, uNummer: row['Benutzer']||'', passwort: row['Passwort']||'', link: row['Link']||'', info: row['Info']||'', createdAt: new Date().toISOString() }); } }); await batch.commit(); showToast('Passwörter importiert.'); }}); }; reader.readAsText(file); };
            const cleanupDuplicates = async () => showToast("Bereinigung gestartet...", "info");
            
            const activeUsers = useMemo(() => users.filter(u => !u.hidden), [users]);
            const navItems = useMemo(() => {
                const items = [ { id: 'dashboard', icon: LayoutDashboard, label: 'Übersicht' }, { id: 'roster', icon: Calendar, label: 'Dienstplan' }, { id: 'customers', icon: Users, label: 'Kunden' }, { id: 'passwords', icon: Lock, label: 'Passwörter' }, { id: 'users', icon: User, label: 'Team' }, { id: 'settings', icon: Settings, label: 'Einstellungen' } ];
                if (currentUser && currentUser.role === 'admin') { items.push({ id: 'activity', icon: Activity, label: 'Protokoll' }); items.push({ id: 'admin', icon: Upload, label: 'Import' }); }
                return items;
            }, [currentUser]);

            // Define missing functions for TeamView inside App
            const saveUser = async (userData) => { if (!firebaseUser || !db) return; try { const isAdmin = currentUser.role === 'admin'; const payload = { ...userData, role: isAdmin ? (userData.role || 'user') : currentUser.role, canEditRoster: isAdmin ? (userData.canEditRoster || false) : (currentUser.canEditRoster || false) }; if (userData.id) await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', userData.id), payload); else { const newId = generateUserId(userData.name); await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', newId), { ...payload, createdAt: new Date().toISOString() }); } showToast("Mitarbeiter gespeichert."); setShowUserModal(false); } catch (err) { showToast("Fehler beim Speichern", 'error'); } };
            const deleteUser = async (uid) => { if(firebaseUser && db) await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', uid)); };
            const toggleUserVisibility = async (u) => { if (firebaseUser && db) await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', u.id), { hidden: !u.hidden }); };
            const openPermissionsModal = (user) => { setPermissionsTargetUser(user); setShowPermissionsModal(true); };
            const togglePermission = async (targetId) => { if(!permissionsTargetUser || !firebaseUser || !db) return; const currentAllowed = permissionsTargetUser.allowedToView || []; let newAllowed; if (currentAllowed.includes(targetId)) newAllowed = currentAllowed.filter(id => id !== targetId); else newAllowed = [...currentAllowed, targetId]; await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', permissionsTargetUser.id), { allowedToView: newAllowed }); setPermissionsTargetUser({...permissionsTargetUser, allowedToView: newAllowed}); };

            if (!isAuthenticated) return (

                    {/* Tasks List Modal */}
                    {showTasksListModal && <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm animate-fade-in"><div className="bg-white rounded-[2rem] p-6 w-full max-w-4xl h-[85vh] shadow-2xl flex flex-col relative"><div className="flex justify-between items-center mb-6 pb-4 border-b border-gray-100"><div><h3 className="text-2xl font-bold text-gray-900">Aufgabenverwaltung</h3><p className="text-sm text-gray-500">Alle offenen und erledigten Aufgaben im Überblick</p></div><button onClick={() => setShowTasksListModal(false)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors"><X size={20}/></button></div><div className="flex-1 overflow-hidden"><TasksWidget tasks={tasks} currentUser={currentUser} onUpdateTask={updateTask} onDeleteTask={deleteTask} onShowTaskModal={setShowTaskModal} allUsers={users} isModal={true} /></div></div></div>}

                                    <button key={item.id} onClick={() => { setCurrentView(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-4 p-4 rounded-2xl font-bold text-lg transition-all border border-transparent active:scale-95 ${currentView === item.id ? 'bg-white shadow-lg text-[#007AFF] border-gray-100' : 'text-gray-500 hover:bg-white/50'}`}>
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${currentView === item.id ? 'bg-blue-50' : 'bg-gray-100'}`}><item.icon size={20} className={currentView === item.id ? 'text-[#007AFF]' : 'text-gray-500'} /></div>{item.label}

                                    <div><p className="font-bold text-gray-900">{currentUser.name}</p><p className="text-xs text-gray-500 capitalize">{currentUser.role}</p></div>
                            </div>
                        </div>

                    <aside className="w-[280px] bg-white/80 backdrop-blur-2xl border-r border-gray-200 hidden md:flex flex-col z-20">

                            <div className="space-y-1">{navItems.map(i => (<button key={i.id} onClick={() => setCurrentView(i.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all ${currentView === i.id ? 'bg-[#007AFF] text-white shadow-md shadow-blue-500/25' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'}`}><i.icon size={20} strokeWidth={currentView === i.id ? 2.5 : 2} />{i.label}</button>))}</div>
                        </div>
                        <div className="mt-auto p-6 border-t border-gray-100"><div className="flex items-center gap-3 mb-4 bg-gray-50 p-3 rounded-2xl"><div className="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-bold text-gray-600">{currentUser.name[0]}</div><div className="overflow-hidden"><p className="text-sm font-bold truncate">{currentUser.name}</p><p className="text-xs text-gray-500 capitalize">{currentUser.role}</p></div></div><button onClick={() => setIsAuthenticated(false)} className="w-full flex items-center gap-2 text-red-500 hover:bg-red-50 p-2 rounded-xl transition-colors text-sm font-medium"><LogOut size={16}/> Abmelden</button></div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col relative overflow-hidden">
                        <div className="md:hidden bg-white/80 backdrop-blur-xl border-b p-4 flex justify-between items-center z-30 sticky top-0 shadow-sm">

                            <button onClick={() => setIsAuthenticated(false)} className="p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-red-50 hover:text-red-500 transition-colors"><LogOut size={18}/></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10 scroll-smooth">
                            <div className="max-w-7xl mx-auto">
                                {currentView === 'dashboard' && <DashboardView {...{ customers: rawCustomers, tasks, shifts, currentUser, onSelectCustomer: setSelectedCustomer, onUpdateTask: updateTask, onDeleteTask: deleteTask, onShowTaskModal: setShowTaskModal, onOpenBirthdays: () => setShowBirthdayModal(true), onOpenExpirations: () => setShowExpirationModal(true), allUsers: users, contractStates, onToggleContractState: toggleContractStatus, onOpenTasks: () => setShowTasksListModal(true), onOpenCustomers: () => setCurrentView('customers') }} />}
                                {currentView === 'roster' && <RosterView users={users} shifts={shifts} closings={closings} currentUser={currentUser} onSaveShift={saveShift} onDeleteShift={deleteShift} onToggleClosing={toggleClosing} />}
                                {currentView === 'customers' && <CustomersView customers={rawCustomers} notesMap={notesMap} onSelectCustomer={setSelectedCustomer} currentUser={currentUser} allUsers={users} onDeleteCustomer={deleteCustomer} requestConfirm={requestConfirm} />}
                                {currentView === 'settings' && <SettingsView user={currentUser} />}
                                {currentView === 'users' && (<TeamView users={users} currentUser={currentUser} onEditUser={(u) => { setUserFormData(u); setShowUserModal(true); }} onDeleteUser={(id) => requestConfirm('Mitarbeiter wirklich löschen?', () => deleteUser(id))} onToggleVisibility={toggleUserVisibility} onOpenPermissions={openPermissionsModal} onCleanup={() => requestConfirm('Duplikate bereinigen?', cleanupDuplicates)} />)}
                                {currentView === 'activity' && currentUser.role === 'admin' && <ActivityLogView logs={logs} />}
                                {currentView === 'admin' && (
                                    <div className="animate-fade-in space-y-6">
                                        <IOSCard title="Datenimport">
                                            <div className="bg-green-50 border border-green-100 p-5 rounded-3xl mb-6">
                                                <h4 className="font-bold text-green-900 mb-2 flex items-center gap-2"><LinkIcon size={18}/> Google Sheets Sync</h4>
                                                <div className="flex gap-2">
                                                    <input value={googleSheetUrl} onChange={e => {setGoogleSheetUrl(e.target.value); localStorage.setItem('crm_sheet_url', e.target.value)}} className="flex-1 bg-white border-0 rounded-xl px-3 py-2 shadow-sm outline-none" placeholder="Link..." />
                                                    <button onClick={() => fetchGoogleData(googleSheetUrl)} className="bg-green-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg hover:bg-green-700 transition-all"><RefreshCw size={18} className={isImporting?'animate-spin':''} /></button>
                                                </div>
                                                {importError && <div className="mt-3 text-xs text-red-600 bg-red-50 p-2 rounded border border-red-200">{importError}</div>}
                                            </div>
                                            <div className="p-5 border-2 border-dashed border-gray-200 rounded-3xl hover:border-blue-400 cursor-pointer relative group">
                                                <div className="text-center text-gray-400 group-hover:text-blue-500"><FileSpreadsheet className="mx-auto mb-2"/> CSV Upload</div>
                                                <input type="file" accept=".csv" onChange={onImportCustomersLocal} className="absolute inset-0 opacity-0 cursor-pointer" />
                                            </div>
                                        </IOSCard>
                                    </div>
                                )}
                                {currentView === 'passwords' && (
                                    <div className="animate-fade-in">
                                        <div className="flex justify-between mb-6">
                                            <h2 className="text-3xl font-bold">Passwörter</h2>
                                            {currentUser.role === 'admin' && (
                                                <div className="flex gap-2">
                                                    <div className="relative overflow-hidden"><IOSButton icon={Upload} variant="secondary">Import</IOSButton><input type="file" accept=".csv, .xlsx, .xls" onChange={(e) => processPwdCSV(e.target.files[0])} className="absolute inset-0 opacity-0 cursor-pointer" /></div>
                                                    <IOSButton icon={Plus} onClick={() => { setPwdFormData({}); setShowPwdModal(true); }}>Neu</IOSButton>
                                                </div>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {passwords.map(p => (
                                                <IOSCard key={p.id}>
                                                    <div className="flex justify-between mb-4">
                                                        <Lock className="text-orange-500"/> 
                                                        {currentUser.role === 'admin' && (<div className="flex gap-2"><button onClick={() => { setPwdFormData(p); setShowPwdModal(true); }} className="text-gray-300 hover:text-blue-500"><Edit3 size={18}/></button><button onClick={() => requestConfirm('Passwort löschen?', () => delPwd(p.id))} className="text-gray-300 hover:text-red-500"><X size={18}/></button></div>)}
                                                    </div>
                                                    <h3 className="font-bold text-gray-800 mb-4 text-lg">{p.name}</h3>
                                                    <div className="bg-gray-50 p-2.5 rounded-lg mb-2 flex justify-between items-center group border border-gray-100">
                                                        <div className="overflow-hidden mr-2"><p className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Benutzer</p><p className="text-sm font-mono text-gray-700 truncate select-all">{p.uNummer}</p></div>
                                                        <button onClick={() => copyToClipboard(p.uNummer, showToast)} className="p-2 text-gray-400 hover:text-blue-600 bg-white rounded-lg shadow-sm border border-gray-100 hover:border-blue-200 transition-all active:scale-95" title="Benutzername kopieren"><Copy size={16}/></button>
                                                    </div>
                                                    <div className="bg-gray-50 p-2.5 rounded-lg mb-2 flex justify-between items-center group border border-gray-100">
                                                        <div className="overflow-hidden mr-2"><p className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Passwort</p><p className="text-sm font-mono text-gray-700 truncate select-all">{p.passwort}</p></div>
                                                        <button onClick={() => copyToClipboard(p.passwort, showToast)} className="p-2 text-gray-400 hover:text-blue-600 bg-white rounded-lg shadow-sm border border-gray-100 hover:border-blue-200 transition-all active:scale-95" title="Passwort kopieren"><Copy size={16}/></button>
                                                    </div>
                                                    {p.link && <div className="text-xs text-center mt-4 pt-2 border-t border-gray-50"><a href={p.link} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 font-medium hover:underline flex items-center justify-center gap-1.5 transition-colors"><ExternalLink size={14} /> Zum Portal öffnen</a></div>}
                                                    {p.info && <div className="mt-3 bg-amber-50 border border-amber-100 p-2.5 rounded-lg text-xs text-amber-800 flex items-start gap-2"><Info size={14} className="shrink-0 mt-0.5" /><span className="leading-snug">{p.info}</span></div>}
                                                </IOSCard>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Modals - Standard */}
                    {showTaskModal && (<div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-2xl font-bold mb-4">Neue Aufgabe</h3><form onSubmit={e => {e.preventDefault(); const fd=new FormData(e.target); addTask({title:fd.get('t'), description:fd.get('d'), assignedTo:fd.get('a'), dueDate:fd.get('date')});}}><div className="space-y-4"><IOSInput name="t" placeholder="Titel" defaultValue={newTaskDefaults.title || ''} required autoFocus /><textarea name="d" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-sm outline-none" rows="3" placeholder="Beschreibung" defaultValue={newTaskDefaults.description || ''}></textarea><div className="grid grid-cols-2 gap-4"><select name="a" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-sm outline-none" defaultValue={currentUser.name}>{activeUsers.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select><IOSInput name="date" type="date" required /></div><div className="flex gap-3 pt-2"><IOSButton className="flex-1" variant="ghost" onClick={() => { setShowTaskModal(false); setNewTaskDefaults({}); }}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Erstellen</IOSButton></div></div></form></div></div>)}
                    {showPwdModal && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-2xl font-bold mb-4">Zugangsdaten</h3><form onSubmit={e => {e.preventDefault(); const fd=new FormData(e.target); savePassword({ id: pwdFormData.id, name: fd.get('name'), uNummer: fd.get('user'), passwort: fd.get('pwd'), link: fd.get('link'), info: fd.get('info') }); }}><div className="space-y-4"><IOSInput name="name" placeholder="Portal Name" defaultValue={pwdFormData.name} required /><IOSInput name="user" placeholder="Benutzername / U-Nummer" defaultValue={pwdFormData.uNummer} /><IOSInput name="pwd" placeholder="Passwort" defaultValue={pwdFormData.passwort} /><IOSInput name="link" placeholder="Link (URL)" defaultValue={pwdFormData.link} /><textarea name="info" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-sm outline-none" rows="2" placeholder="Zusatzinfo" defaultValue={pwdFormData.info}></textarea><div className="flex gap-3 pt-2"><IOSButton className="flex-1" variant="ghost" onClick={() => setShowPwdModal(false)}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Speichern</IOSButton></div></div></form></div></div>)}
                    {showUserModal && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-2xl font-bold mb-4">{userFormData.id === currentUser.id ? 'Profil bearbeiten' : 'Mitarbeiter bearbeiten'}</h3><form onSubmit={e => { e.preventDefault(); const fd = new FormData(e.target); saveUser({ id: userFormData.id, name: fd.get('name'), code: fd.get('code'), adv: fd.get('adv'), btnr: fd.get('btnr'), uNumber: fd.get('uNumber'), avusPassword: fd.get('avusPassword'), role: userFormData.role || 'user', canEditRoster: fd.get('canEditRoster') === 'on' }); }}><div className="space-y-4"><IOSInput name="name" placeholder="Name (Vorname Nachname)" defaultValue={userFormData.name} required /><div className="bg-blue-50 p-3 rounded-xl border border-blue-100"><label className="text-xs font-bold text-blue-600 uppercase mb-1 block">Login Code</label><IOSInput name="code" placeholder="4-stellig" defaultValue={userFormData.code} maxLength={4} required /></div>{currentUser.role === 'admin' && (<div className="bg-gray-50 p-3 rounded-xl border border-gray-100"><label className="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="canEditRoster" defaultChecked={userFormData.canEditRoster} className="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" /><span className="text-sm font-bold text-gray-700">Darf Dienstplan bearbeiten</span></label></div>)}<div className="grid grid-cols-2 gap-4"><IOSInput name="adv" placeholder="ADV Nummer" defaultValue={userFormData.adv} /><IOSInput name="btnr" placeholder="Betreuernr. (BTNR)" defaultValue={userFormData.btnr} /></div><div className="grid grid-cols-2 gap-4"><IOSInput name="uNumber" placeholder="U-Nummer" defaultValue={userFormData.uNumber} /><IOSInput name="avusPassword" placeholder="AVUS Kennwort" defaultValue={userFormData.avusPassword} /></div>{currentUser.role === 'admin' && (<div className="pt-2 border-t border-gray-100"><label className="text-xs font-bold text-gray-500 uppercase mb-2 block">Darf Daten sehen von (ADP):</label><select className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none mb-3" onChange={(e) => { const selectedId = e.target.value; if (selectedId && !editingUserAllowedToView.includes(selectedId)) { setEditingUserAllowedToView([...editingUserAllowedToView, selectedId]); } e.target.value = ""; }}><option value="">Berechtigung hinzufügen...</option>{activeUsers.filter(u => u.id !== userFormData.id).map(u => (<option key={u.id} value={u.id}>{u.name} {u.adv ? `(ADV: ${u.adv})` : ''}</option>))}</select><div className="flex flex-wrap gap-2">{editingUserAllowedToView.map(id => { const u = users.find(user => user.id === id); if (!u) return null; return (<div key={id} className="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded-full flex items-center gap-1 border border-blue-100"><span>{u.name}</span><button type="button" onClick={() => setEditingUserAllowedToView(prev => prev.filter(pid => pid !== id))} className="hover:text-blue-900"><X size={12} /></button></div>); })}{editingUserAllowedToView.length === 0 && <span className="text-xs text-gray-400 italic">Keine zusätzlichen Berechtigungen</span>}</div></div>)}<div className="flex gap-3 pt-4"><IOSButton className="flex-1" variant="ghost" onClick={() => setShowUserModal(false)}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Speichern</IOSButton></div></div></form></div></div>)}
                    
                    {/* Modals - Special */}
                    {showPermissionsModal && permissionsTargetUser && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-xl font-bold mb-4">Sichtbarkeit für {permissionsTargetUser.name}</h3><p className="text-sm text-gray-500 mb-4">Wähle Mitarbeiter, deren Kunden dieser Nutzer sehen darf:</p><div className="space-y-2 max-h-60 overflow-y-auto mb-4">{activeUsers.filter(u => u.id !== permissionsTargetUser.id).map(u => { const isAllowed = permissionsTargetUser.allowedToView?.includes(u.id); return (<div key={u.id} onClick={() => togglePermission(u.id)} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer border transition-all ${isAllowed ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-transparent hover:bg-gray-100'}`}>{isAllowed ? <CheckCircle className="text-blue-600" size={20}/> : <Circle className="text-gray-400" size={20}/>}<span className="font-semibold text-blue-900">{u.name}</span></div>); })}{activeUsers.length <= 1 && <p className="text-center text-gray-400 text-sm">Keine anderen Mitarbeiter verfügbar.</p>}</div><div className="flex justify-end"><IOSButton onClick={() => setShowPermissionsModal(false)}>Fertig</IOSButton></div></div></div>)}
                    {showBirthdayModal && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-lg shadow-2xl animate-scale-in max-h-[80vh] flex flex-col"><div className="flex justify-between items-center mb-4"><h3 className="text-2xl font-bold flex items-center gap-2"><Calendar className="text-amber-500"/> Geburtstage</h3><button onClick={() => setShowBirthdayModal(false)} className="p-2 bg-gray-100 rounded-full"><X size={20}/></button></div><div className="flex-1 overflow-y-auto space-y-2">{allUpcomingBirthdays.length === 0 && <p className="text-gray-400 text-center py-4">Keine Geburtstage in den nächsten 30 Tagen.</p>}{allUpcomingBirthdays.map(c => (<div key={c.id} onClick={() => { setShowBirthdayModal(false); setSelectedCustomer(c); }} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-amber-50 transition-colors"><span className="font-medium">{c.vorname} {c.name}</span><span className="text-amber-600 font-bold bg-white px-2 py-1 rounded-lg text-xs shadow-sm">{c.gebDatum}</span></div>))}</div></div></div>)}
                    {showExpirationModal && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-3xl p-8 w-full max-w-4xl shadow-2xl animate-scale-in max-h-[85vh] flex flex-col"><div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-4"><div><h3 className="text-2xl font-bold flex items-center gap-2"><AlertCircle className="text-red-500"/> Abläufe Management</h3><p className="text-xs text-gray-400">Verträge in den nächsten 90 Tagen</p></div><button onClick={() => setShowExpirationModal(false)} className="p-2 bg-gray-100 rounded-full"><X size={20}/></button></div><div className="flex-1 overflow-y-auto space-y-2">{displayedExpirations.length === 0 && <p className="text-gray-400 text-center py-10">Keine Verträge in dieser Ansicht.</p>}{displayedExpirations.map((item, idx) => (<div key={idx} className="flex justify-between items-center p-3 bg-white border border-gray-100 rounded-xl hover:shadow-md transition-all group"><div onClick={() => { setShowExpirationModal(false); setSelectedCustomer(item.customer); }} className="flex-1 cursor-pointer"><div className="flex items-center gap-2 mb-1"><p className="font-bold text-gray-900 text-sm">{item.customer.vorname} {item.customer.name}</p><span className="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">{item.customer.zustMA}</span></div><div className="flex gap-4 text-xs text-gray-500"><span className="font-medium text-gray-700">{item.contract.sparte}</span><span className="font-mono">{item.contract.vsnr}</span></div></div><div className="text-right flex items-center gap-4"><div><span className={`font-mono font-bold bg-gray-50 px-2 py-1 rounded-lg text-xs ${expTab === 'open' ? 'text-red-600' : 'text-green-600'}`}>{item.contract.ablauf}</span></div><button onClick={() => toggleContractStatus(item.id, item.status)} className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${expTab === 'open' ? 'bg-gray-100 hover:bg-green-100 text-gray-400 hover:text-green-600' : 'bg-green-100 hover:bg-yellow-100 text-green-600 hover:text-yellow-600'}`} title={expTab === 'open' ? "Als erledigt markieren" : "Wieder öffnen"}>{expTab === 'open' ? <CheckCircle size={18}/> : <RotateCcw size={18}/>}</button></div></div>))}</div></div></div>)}

                    {/* Customer Detail Modal */}
                    {selectedCustomer && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm"><div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-4xl max-h-[85vh] overflow-hidden flex flex-col animate-scale-in"><div className="p-6 bg-gray-50 border-b flex justify-between items-start"><div className="flex gap-4 items-center"><div><h2 className="text-2xl font-bold">{selectedCustomer.vorname} {selectedCustomer.name}</h2><IOSBadge color="green">Aktiv</IOSBadge></div></div><button onClick={() => setSelectedCustomer(null)} className="p-2 bg-gray-200 rounded-full hover:bg-gray-300"><X size={20}/></button></div><div className="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8"><div className="space-y-6"><div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Kontakt</h3><div className="space-y-2 text-sm"><div className="flex gap-2 items-center"><Phone size={14} className="text-blue-500"/> {selectedCustomer.handy || '-'}</div><div className="flex gap-2 items-center"><Mail size={14} className="text-blue-500"/> {selectedCustomer.mail || '-'}</div><div className="flex gap-2 items-center"><MapPin size={14} className="text-blue-500"/> {selectedCustomer.strasse}, {selectedCustomer.ort}</div></div></div><div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Info</h3><div className="bg-gray-50 p-3 rounded-xl text-sm">Geb: {selectedCustomer.gebDatum}<br/>Betreuer: {selectedCustomer.zustMA}</div></div>{analyzeGaps(selectedCustomer.verträge).length > 0 && (<div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Potenziale</h3><div className="flex flex-wrap gap-2">{analyzeGaps(selectedCustomer.verträge).map(g => <span key={g} className="bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded-full font-semibold">{g}</span>)}</div></div>)}<div className="flex gap-2 flex-wrap"><button onClick={() => window.open(`mailto:${selectedCustomer.mail}?subject=Ihre Versicherungsangelegenheiten`)} className="flex-1 bg-blue-50 text-blue-600 rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100"><Mail size={16}/> Email</button><button onClick={() => generatePDF(selectedCustomer, notesMap[selectedCustomer.id])} className="flex-1 bg-blue-50 text-blue-600 rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100"><Download size={16}/> PDF</button><button onClick={() => handleCreateTaskForCustomer(selectedCustomer)} className="w-full bg-blue-600 text-white rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md shadow-blue-500/20"><ClipboardList size={16}/> Aufgabe erstellen</button></div><div className="mt-4 pt-4 border-t border-gray-100"><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Dokumente & Vorlagen (Word)</h3><div className="grid grid-cols-1 gap-2"><button onClick={() => generateWordDoc('blanko', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200"><Printer size={16}/> Blanko Vorlage</button><button onClick={() => generateWordDoc('rueckruf', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200"><Phone size={16}/> Rückrufbitte</button><button onClick={() => generateWordDoc('kuendigung', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-2 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200"><FileText size={16}/> Kündigung</button></div></div></div><div className="md:col-span-2 space-y-6"><div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Verträge</h3><div className="space-y-2">{selectedCustomer.verträge?.map((v, i) => (<div key={i} className="border p-3 rounded-xl flex justify-between items-start hover:shadow-sm transition-all"><div className="flex-1"><p className="font-bold text-gray-900">{v.sparte}</p><p className="text-xs text-gray-500 font-mono">{v.vsnr}</p>{v.risiken && <p className="text-xs text-gray-700 mt-1 font-medium bg-gray-100 px-1 rounded inline-block">{v.risiken}</p>}</div><div className="text-right">{v.zahlweise.toLowerCase().includes('monatlich') ? (<><p className="font-bold text-gray-900">{v.mob} € <span className="text-[10px] font-normal text-gray-500">mtl.</span></p><p className="text-xs text-gray-400">{v.beitrag} € / Jahr</p></>) : (<p className="font-bold text-gray-900">{v.beitrag} € <span className="text-[10px] font-normal text-gray-500">/ Jahr</span></p>)}<div className="text-[10px] text-gray-500 mt-1"><span>{v.beginn}</span> - <span className={isExpiringSoon(v.ablauf) ? 'text-red-600 font-bold' : ''}>{v.ablauf}</span></div><p className="text-[10px] uppercase text-gray-400">{v.zahlweise}</p></div></div>))}</div></div><div className="flex flex-col h-48 bg-amber-50 rounded-xl p-4 border border-amber-100"><div className="flex-1 overflow-y-auto mb-2 space-y-2">{notesMap[selectedCustomer.id]?.map((n, i) => (<div key={i} className="bg-white p-2 rounded text-xs shadow-sm">{n.text} <span className="text-[10px] text-gray-400 block text-right">{n.date} - {n.author}</span></div>))}</div><div className="flex gap-2"><input id="note" className="flex-1 text-sm bg-white border-0 rounded px-2 py-1 outline-none" placeholder="Notiz..." /><button onClick={() => {const el=document.getElementById('note'); if(el.value){addNote(selectedCustomer.id, el.value); el.value='';}}} className="bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold">Senden</button></div></div></div></div></div></div>)}

                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
