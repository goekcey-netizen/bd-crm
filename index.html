                                                <IOSCard title="Datenimport">
                                                    <div className="bg-green-50 border border-green-100 p-5 rounded-3xl mb-6">
                                                        <h4 className="font-bold text-green-900 mb-2 flex items-center gap-2"><LinkIcon size={18}/> Google Sheets Sync</h4>
                                                        <div className="flex gap-2">
                                                            <input value={googleSheetUrl} onChange={e => {setGoogleSheetUrl(e.target.value); localStorage.setItem('crm_sheet_url', e.target.value)}} className="flex-1 bg-white border-0 rounded-xl px-3 py-2 shadow-sm outline-none text-base sm:text-sm" placeholder="Link..." />
                                                            <button onClick={() => fetchGoogleData(googleSheetUrl)} className="bg-green-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg hover:bg-green-700 transition-all active:scale-95"><RefreshCw size={18} className={isImporting?'animate-spin':''} /></button>
                                                        </div>
                                                        {importError && <div className="mt-3 text-xs text-red-600 bg-red-50 p-2 rounded border border-red-200">{importError}</div>}
                                                    </div>
                                                    <div className="p-5 border-2 border-dashed border-gray-200 rounded-3xl hover:border-blue-400 cursor-pointer relative group">
                                                        <div className="text-center text-gray-400 group-hover:text-blue-500"><FileSpreadsheet className="mx-auto mb-2"/> CSV Upload</div>
                                                        <input type="file" accept=".csv" onChange={onImportCustomersLocal} className="absolute inset-0 opacity-0 cursor-pointer" />
                                                    </div>
                                                </IOSCard>
                                            </div>
                                        )}
                                        </div>
                                    </div>
                                </main>
                                
                                {/* --- MODALS --- */}
                                {selectedCustomer && (
                                    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe">
                                        <div className="bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl w-full max-w-4xl max-h-[90vh] sm:max-h-[85vh] overflow-hidden flex flex-col animate-scale-in">
                                            <div className="p-6 bg-gray-50 border-b flex justify-between items-start sticky top-0 z-10">
                                                <div className="flex gap-4 items-center"><div><h2 className="text-2xl font-bold">{selectedCustomer.vorname} {selectedCustomer.name}</h2><IOSBadge color="green">Aktiv</IOSBadge></div></div>
                                                <button onClick={() => setSelectedCustomer(null)} className="p-2 bg-gray-200 rounded-full hover:bg-gray-300"><X size={20}/></button>
                                            </div>
                                            <div className="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8 overscroll-contain">
                                                <div className="space-y-6">
                                                    <div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Kontakt</h3><div className="space-y-2 text-sm"><a href={`tel:${selectedCustomer.handy}`} className="flex gap-2 items-center text-blue-600"><Phone size={14} /> {selectedCustomer.handy || '-'}</a><a href={`mailto:${selectedCustomer.mail}`} className="flex gap-2 items-center text-blue-600"><Mail size={14} /> {selectedCustomer.mail || '-'}</a><div className="flex gap-2 items-center text-gray-700"><MapPin size={14} className="text-gray-400"/> {selectedCustomer.strasse}, {selectedCustomer.ort}</div></div></div>
                                                    <div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Info</h3><div className="bg-gray-50 p-3 rounded-xl text-sm">Geb: {selectedCustomer.gebDatum}<br/>Betreuer: {selectedCustomer.zustMA}</div></div>
                                                    {analyzeGaps(selectedCustomer.verträge).length > 0 && (<div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Potenziale</h3><div className="flex flex-wrap gap-2">{analyzeGaps(selectedCustomer.verträge).map(g => <span key={g} className="bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded-full font-semibold">{g}</span>)}</div></div>)}
                                                    <div className="flex gap-2 flex-wrap">
                                                        <button onClick={() => window.open(`mailto:${selectedCustomer.mail}?subject=Ihre Versicherungsangelegenheiten`)} className="flex-1 bg-blue-50 text-blue-600 rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100 active:scale-95"><Mail size={16}/> Email</button>
                                                        <button onClick={() => generatePDF(selectedCustomer, notesMap[selectedCustomer.id])} className="flex-1 bg-blue-50 text-blue-600 rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100 active:scale-95"><Download size={16}/> PDF</button>
                                                        <button onClick={() => handleCreateTaskForCustomer(selectedCustomer)} className="w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md shadow-blue-500/20 active:scale-95"><ClipboardList size={16}/> Aufgabe</button>
                                                    </div>
                                                    <div className="mt-4 pt-4 border-t border-gray-100">
                                                        <h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Dokumente</h3>
                                                        <div className="grid grid-cols-1 gap-2">
                                                            <button onClick={() => generateWordDoc('blanko', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200 active:scale-95"><Printer size={16}/> Blanko</button>
                                                            <button onClick={() => generateWordDoc('rueckruf', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200 active:scale-95"><Phone size={16}/> Rückruf</button>
                                                            <button onClick={() => generateWordDoc('kuendigung', selectedCustomer, currentUser)} className="w-full bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-200 active:scale-95"><FileText size={16}/> Kündigung</button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="md:col-span-2 space-y-6 pb-20 sm:pb-0">
                                                    <div><h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Verträge</h3><div className="space-y-2">{selectedCustomer.verträge?.map((v, i) => (<div key={i} className="border p-3 rounded-xl flex justify-between items-start hover:shadow-sm transition-all"><div className="flex-1"><p className="font-bold text-gray-900">{v.sparte}</p><p className="text-xs text-gray-500 font-mono">{v.vsnr}</p>{v.risiken && <p className="text-xs text-gray-700 mt-1 font-medium bg-gray-100 px-1 rounded inline-block">{v.risiken}</p>}</div><div className="text-right">{v.zahlweise.toLowerCase().includes('monatlich') ? (<><p className="font-bold text-gray-900">{v.mob} € <span className="text-[10px] font-normal text-gray-500">mtl.</span></p><p className="text-xs text-gray-400">{v.beitrag} € / Jahr</p></>) : (<p className="font-bold text-gray-900">{v.beitrag} € <span className="text-[10px] font-normal text-gray-500">/ Jahr</span></p>)}<div className="text-[10px] text-gray-500 mt-1"><span>{v.beginn}</span> - <span className={isExpiringSoon(v.ablauf) ? 'text-red-600 font-bold' : ''}>{v.ablauf}</span></div><p className="text-[10px] uppercase text-gray-400">{v.zahlweise}</p></div></div>))}</div></div>
                                                    <div className="flex flex-col h-48 bg-amber-50 rounded-xl p-4 border border-amber-100"><div className="flex-1 overflow-y-auto mb-2 space-y-2">{notesMap[selectedCustomer.id]?.map((n, i) => (<div key={i} className="bg-white p-2 rounded text-xs shadow-sm">{n.text} <span className="text-[10px] text-gray-400 block text-right">{n.date} - {n.author}</span></div>))}</div><div className="flex gap-2"><input id="note" className="flex-1 text-base bg-white border-0 rounded-xl px-3 py-2 outline-none" placeholder="Notiz..." /><button onClick={() => {const el=document.getElementById('note'); if(el.value){addNote(selectedCustomer.id, el.value); el.value='';}}} className="bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold active:scale-95">Senden</button></div></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                {showBirthdayModal && (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-lg shadow-2xl animate-scale-in max-h-[85vh] flex flex-col"><div className="flex justify-between items-center mb-4"><h3 className="text-2xl font-bold flex items-center gap-2"><Calendar className="text-amber-500"/> Geburtstage</h3><button onClick={() => setShowBirthdayModal(false)} className="p-2 bg-gray-100 rounded-full"><X size={20}/></button></div><div className="flex-1 overflow-y-auto space-y-2 pb-8 sm:pb-0">{allUpcomingBirthdays.length === 0 && <p className="text-gray-400 text-center py-4">Keine Geburtstage in den nächsten 30 Tagen.</p>}{allUpcomingBirthdays.map(c => (<div key={c.id} onClick={() => { setShowBirthdayModal(false); setSelectedCustomer(c); }} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-amber-50 transition-colors"><span className="font-medium">{c.vorname} {c.name}</span><span className="text-amber-600 font-bold bg-white px-2 py-1 rounded-lg text-xs shadow-sm">{c.gebDatum}</span></div>))}</div></div></div>)}
                                {showExpirationModal && (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-4xl shadow-2xl animate-scale-in max-h-[90vh] sm:max-h-[85vh] flex flex-col"><div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-4"><div><h3 className="text-2xl font-bold flex items-center gap-2"><AlertCircle className="text-red-500"/> Abläufe</h3><p className="text-xs text-gray-400">Verträge in den nächsten 90 Tagen</p></div><button onClick={() => setShowExpirationModal(false)} className="p-2 bg-gray-100 rounded-full"><X size={20}/></button></div><div className="flex-1 overflow-y-auto space-y-2 pb-8 sm:pb-0">{displayedExpirations.length === 0 && <p className="text-gray-400 text-center py-10">Keine Verträge in dieser Ansicht.</p>}{displayedExpirations.map((item, idx) => (<div key={idx} className="flex justify-between items-center p-3 bg-white border border-gray-100 rounded-xl hover:shadow-md transition-all group"><div onClick={() => { setShowExpirationModal(false); setSelectedCustomer(item.customer); }} className="flex-1 cursor-pointer"><div className="flex items-center gap-2 mb-1"><p className="font-bold text-gray-900 text-sm">{item.customer.vorname} {item.customer.name}</p><span className="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">{item.customer.zustMA}</span></div><div className="flex gap-4 text-xs text-gray-500"><span className="font-medium text-gray-700">{item.contract.sparte}</span><span className="font-mono">{item.contract.vsnr}</span></div></div><div className="text-right flex items-center gap-4"><div><span className={`font-mono font-bold bg-gray-50 px-2 py-1 rounded-lg text-xs ${expTab === 'open' ? 'text-red-600' : 'text-green-600'}`}>{item.contract.ablauf}</span></div><button onClick={() => toggleContractStatus(item.id, item.status)} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all active:scale-95 ${expTab === 'open' ? 'bg-gray-100 hover:bg-green-100 text-gray-400 hover:text-green-600' : 'bg-green-100 hover:bg-yellow-100 text-green-600 hover:text-yellow-600'}`} title={expTab === 'open' ? "Als erledigt markieren" : "Wieder öffnen"}>{expTab === 'open' ? <CheckCircle size={20}/> : <RotateCcw size={20}/>}</button></div></div>))}</div></div></div>)}
                                {showTaskModal && (<div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-2xl font-bold mb-4">Neue Aufgabe</h3><form onSubmit={e => {e.preventDefault(); const fd=new FormData(e.target); addTask({title:fd.get('t'), description:fd.get('d'), assignedTo:fd.get('a'), dueDate:fd.get('date')});}}><div className="space-y-4"><IOSInput name="t" placeholder="Titel" defaultValue={newTaskDefaults.title || ''} required autoFocus /><textarea name="d" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-base outline-none" rows="3" placeholder="Beschreibung" defaultValue={newTaskDefaults.description || ''}></textarea><div className="grid grid-cols-2 gap-4"><select name="a" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-base outline-none" defaultValue={currentUser.name}>{activeUsers.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select><IOSInput name="date" type="date" required /></div><div className="flex gap-3 pt-2"><IOSButton className="flex-1" variant="ghost" onClick={() => { setShowTaskModal(false); setNewTaskDefaults({}); }}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Erstellen</IOSButton></div></div></form></div></div>)}
                                {showPwdModal && (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-2xl font-bold mb-4">Zugangsdaten</h3><form onSubmit={e => {e.preventDefault(); const fd=new FormData(e.target); savePassword({ id: pwdFormData.id, name: fd.get('name'), uNummer: fd.get('user'), passwort: fd.get('pwd'), link: fd.get('link'), info: fd.get('info') }); }}><div className="space-y-4"><IOSInput name="name" placeholder="Portal Name" defaultValue={pwdFormData.name} required /><IOSInput name="user" placeholder="Benutzername / U-Nummer" defaultValue={pwdFormData.uNummer} /><IOSInput name="pwd" placeholder="Passwort" defaultValue={pwdFormData.passwort} /><IOSInput name="link" placeholder="Link (URL)" defaultValue={pwdFormData.link} /><textarea name="info" className="w-full bg-gray-100/50 border-0 rounded-xl px-4 py-3 text-base outline-none" rows="2" placeholder="Zusatzinfo" defaultValue={pwdFormData.info}></textarea><div className="flex gap-3 pt-2"><IOSButton className="flex-1" variant="ghost" onClick={() => setShowPwdModal(false)}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Speichern</IOSButton></div></div></form></div></div>)}
                                {showUserModal && (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl animate-scale-in max-h-[90vh] overflow-y-auto"><h3 className="text-2xl font-bold mb-4">{userFormData.id === currentUser.id ? 'Profil bearbeiten' : 'Mitarbeiter bearbeiten'}</h3><form onSubmit={e => { e.preventDefault(); const fd = new FormData(e.target); saveUser({ id: userFormData.id, name: fd.get('name'), code: fd.get('code'), adv: fd.get('adv'), btnr: fd.get('btnr'), uNumber: fd.get('uNumber'), avusPassword: fd.get('avusPassword'), role: userFormData.role || 'user', canEditRoster: fd.get('canEditRoster') === 'on' }); }}><div className="space-y-4"><IOSInput name="name" placeholder="Name (Vorname Nachname)" defaultValue={userFormData.name} required /><div className="bg-blue-50 p-3 rounded-xl border border-blue-100"><label className="text-xs font-bold text-blue-600 uppercase mb-1 block">Login Code</label><IOSInput name="code" placeholder="4-stellig" defaultValue={userFormData.code} maxLength={4} required /></div>{currentUser.role === 'admin' && (<div className="bg-gray-50 p-3 rounded-xl border border-gray-100"><label className="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="canEditRoster" defaultChecked={userFormData.canEditRoster} className="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" /><span className="text-sm font-bold text-gray-700">Darf Dienstplan bearbeiten</span></label></div>)}<div className="grid grid-cols-2 gap-4"><IOSInput name="adv" placeholder="ADV Nummer" defaultValue={userFormData.adv} /><IOSInput name="btnr" placeholder="Betreuernr. (BTNR)" defaultValue={userFormData.btnr} /></div><div className="grid grid-cols-2 gap-4"><IOSInput name="uNumber" placeholder="U-Nummer" defaultValue={userFormData.uNumber} /><IOSInput name="avusPassword" placeholder="AVUS Kennwort" defaultValue={userFormData.avusPassword} /></div>{currentUser.role === 'admin' && (<div className="pt-2 border-t border-gray-100"><label className="text-xs font-bold text-gray-500 uppercase mb-2 block">Darf Daten sehen von (ADP):</label><select className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-base outline-none mb-3" onChange={(e) => { const selectedId = e.target.value; if (selectedId && !editingUserAllowedToView.includes(selectedId)) { setEditingUserAllowedToView([...editingUserAllowedToView, selectedId]); } e.target.value = ""; }}><option value="">Berechtigung hinzufügen...</option>{activeUsers.filter(u => u.id !== userFormData.id).map(u => (<option key={u.id} value={u.id}>{u.name} {u.adv ? `(ADV: ${u.adv})` : ''}</option>))}</select><div className="flex flex-wrap gap-2">{editingUserAllowedToView.map(id => { const u = users.find(user => user.id === id); if (!u) return null; return (<div key={id} className="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded-full flex items-center gap-1 border border-blue-100"><span>{u.name}</span><button type="button" onClick={() => setEditingUserAllowedToView(prev => prev.filter(pid => pid !== id))} className="hover:text-blue-900"><X size={12} /></button></div>); })}{editingUserAllowedToView.length === 0 && <span className="text-xs text-gray-400 italic">Keine zusätzlichen Berechtigungen</span>}</div></div>)}<div className="flex gap-3 pt-4"><IOSButton className="flex-1" variant="ghost" onClick={() => setShowUserModal(false)}>Abbrechen</IOSButton><IOSButton className="flex-1" type="submit">Speichern</IOSButton></div></div></form></div></div>)}
                                {showPermissionsModal && permissionsTargetUser && (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/40 backdrop-blur-sm pb-safe"><div className="bg-white rounded-t-[2rem] sm:rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl animate-scale-in"><h3 className="text-xl font-bold mb-4">Sichtbarkeit für {permissionsTargetUser.name}</h3><p className="text-sm text-gray-500 mb-4">Wähle Mitarbeiter, deren Kunden dieser Nutzer sehen darf:</p><div className="space-y-2 max-h-60 overflow-y-auto mb-4">{activeUsers.filter(u => u.id !== permissionsTargetUser.id).map(u => { const isAllowed = permissionsTargetUser.allowedToView?.includes(u.id); return (<div key={u.id} onClick={() => togglePermission(u.id)} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer border transition-all ${isAllowed ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-transparent hover:bg-gray-100'}`}>{isAllowed ? <CheckCircle className="text-blue-600" size={20}/> : <Circle className="text-gray-400" size={20}/>}<span className="font-semibold text-blue-900">{u.name}</span></div>); })}{activeUsers.length <= 1 && <p className="text-center text-gray-400 text-sm">Keine anderen Mitarbeiter verfügbar.</p>}</div><div className="flex justify-end"><IOSButton onClick={() => setShowPermissionsModal(false)}>Fertig</IOSButton></div></div></div>)}
                            </>
                        ) : (
                            <div className="flex flex-col items-center justify-center w-full h-full text-center p-6">
                                <AlertTriangle size={48} className="text-red-500 mb-4"/>
                                <h2 className="text-xl font-bold mb-2">Benutzerstatus verloren</h2>
                                <p className="text-gray-500 mb-6">Bitte lade die Seite neu.</p>
                                <button onClick={() => window.location.reload()} className="bg-gray-200 px-6 py-2 rounded-xl font-bold">Neu laden</button>
                            </div>
                        )}
                    </div>
                </ErrorBoundary>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
